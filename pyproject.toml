[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501:      long lines, mostly the inline HTML/CSS landing page.
# E701/E702: the command handler deliberately uses `if key in cmd: state.x = ...`
#            one-liners for its long option-copy blocks.
# B008:      FastAPI's File(None) / Form(...) parameter-default idiom.
ignore = ["E501", "E701", "E702", "B008"]

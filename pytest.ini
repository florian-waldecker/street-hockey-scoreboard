[pytest]
testpaths = tests
# Repo root on sys.path so tests/conftest.py can `import main` regardless of
# how pytest is launched (console script vs. python -m).
pythonpath = .
# pytest-ansible ships in some global envs and blows up on import on Windows
# (no fcntl). We don't use it - keep it out of the way.
addopts = -p no:pytest-ansible

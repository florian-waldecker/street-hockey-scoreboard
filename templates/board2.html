<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard Display v2 | Großanzeige</title>
    <style>
        /* ===== bundled fonts (offline) - broadcast condensed grotesque ===== */
        @font-face {
            font-family: 'Oswald';
            src: url('/static/fonts/oswald-latin.woff2') format('woff2');
            font-weight: 200 700; font-style: normal; font-display: swap;
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2074,
                U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'Oswald';
            src: url('/static/fonts/oswald-latin-ext.woff2') format('woff2');
            font-weight: 200 700; font-style: normal; font-display: swap;
            unicode-range: U+0100-02BA, U+1E00-1EFF, U+2020, U+20A0-20AB,
                U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }
        @font-face {
            font-family: 'Saira Condensed';
            src: url('/static/fonts/saira-cond-600-latin.woff2') format('woff2');
            font-weight: 600; font-style: normal; font-display: swap;
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2074,
                U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'Saira Condensed';
            src: url('/static/fonts/saira-cond-600-latin-ext.woff2') format('woff2');
            font-weight: 600; font-style: normal; font-display: swap;
            unicode-range: U+0100-02BA, U+1E00-1EFF, U+2020, U+20A0-20AB,
                U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }
        @font-face {
            font-family: 'Saira Condensed';
            src: url('/static/fonts/saira-cond-700-latin.woff2') format('woff2');
            font-weight: 700; font-style: normal; font-display: swap;
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2074,
                U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'Saira Condensed';
            src: url('/static/fonts/saira-cond-700-latin-ext.woff2') format('woff2');
            font-weight: 700; font-style: normal; font-display: swap;
            unicode-range: U+0100-02BA, U+1E00-1EFF, U+2020, U+20A0-20AB,
                U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }

        :root {
            --bg-dark: #05090f;
            --surface-bg: #111726;
            --surface-card: #182238;
            --border: #23314e;
            --accent-home: #2b83ff;
            --accent-away: #f5c518;
            --text-main: #ffffff;
            --text-dim: #8fa0be;
            --gold: #f5c518;
            --divider: rgba(255, 255, 255, 0.09);
            --glow-gold: 0 0 35px rgba(250, 204, 21, 0.45);
            --cond: 'Oswald', 'Bahnschrift', 'Arial Narrow', sans-serif;
            --num: 'Saira Condensed', 'Oswald', 'Bahnschrift', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        [hidden] { display: none !important; }
        body {
            font-family: var(--cond);
            font-weight: 400;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* ================= LIVE SCOREBOARD v2 - full-bleed broadcast graphic ================= */
        #matchView {
            position: relative;
            z-index: 1;
            height: 100%;
            width: 100%;
            /* textured arena backdrop */
            background:
                radial-gradient(130% 80% at 50% -12%, #16273c 0%, #0b1523 46%, #05090f 100%);
        }

        .sb {
            /* one slant for every parallelogram on the board: 42px over the 31vh
               top bar == this ratio. Each bar derives its own skew from its own
               height * --slant-ratio, so every angle comes out identical. */
            --slant-ratio: 0.1254;
            --bar: 5px;   /* team-colour edge-line thickness (timebox & sponsor) */
            position: relative;
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0.6vh 0;   /* the top & bottom panels float clear of the screen edges */
        }

        /* bright light-bar along the top & bottom edge of every panel -
           only as wide as that panel's parallelograms, offset to follow the
           slanted top/bottom edges. */
        .sb-topbar::before,
        .sb-topbar::after,
        .sb-midbar::before,
        .sb-midbar::after,
        .sb-penbar::before,
        .sb-penbar::after {
            content: "";
            position: absolute;
            height: 0.42vh; min-height: 3px;
            z-index: 6;
            background: linear-gradient(90deg,
                transparent 0%,
                var(--home-color, var(--accent-home)) 14%,
                #ffffff 50%,
                var(--away-color, var(--accent-away)) 86%,
                transparent 100%);
            box-shadow: 0 0 16px 2px rgba(255, 255, 255, 0.14);
        }
        .sb-topbar::before { top: -1.5px;    left: calc(2.4vw + var(--skew));  right: 2.4vw; }
        .sb-topbar::after  { bottom: -1.5px; left: 2.4vw; right: calc(2.4vw + var(--skew)); }
        .sb-midbar::before { top: calc(1.5vh - 1.5px); left: calc(2.4vw + var(--mskew)); right: 2.4vw; }
        .sb-midbar::after  { bottom: calc(1.5vh - 1.5px); left: 2.4vw; right: calc(2.4vw + var(--mskew)); }
        .sb-penbar::before { top: calc(1.4vh - 1.5px); left: calc(2.4vw + var(--pskew)); right: 2.4vw; }
        .sb-penbar::after  { bottom: calc(1.4vh - 1.5px); left: 2.4vw; right: calc(2.4vw + var(--pskew)); }
        .sb-glow {
            position: absolute;
            left: 0; right: 0; bottom: -7vh;
            height: 14vh;
            z-index: 5;
            pointer-events: none;
            filter: blur(16px);
            background:
                radial-gradient(48% 100% at 33% 100%, color-mix(in srgb, var(--home-color, var(--accent-home)) 45%, transparent), transparent 72%),
                radial-gradient(48% 100% at 67% 100%, color-mix(in srgb, var(--away-color, var(--accent-away)) 38%, transparent), transparent 72%);
        }

        /* ------------------------------ TOP PANEL ------------------------------ */
        .sb-topbar {
            --home-color: var(--accent-home);
            --away-color: var(--accent-away);
            position: relative;
            z-index: 3;
            flex: 0 0 28vh;
            display: flex;
            align-items: stretch;
            padding: 0 2.4vw;   /* float clear of the screen edges, like the other panels */
        }

        /* the identity ends of the panel: a plain parallelogram fill, slanted
           outer edge, NO edge line */
        .sb-team {
            position: relative;
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 1.6vw;
            padding: 0 1.4vw 0 1.9vw;
            z-index: 2;
        }
        .sb-team::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            background: linear-gradient(180deg, #0e2137 0%, #0a1728 55%, #081420 100%);
            clip-path: polygon(var(--skew) 0, 100% 0, calc(100% - var(--skew)) 100%, 0 100%);
        }
        /* the fill reaches under the score box so the diagonal cut tessellates,
           without pulling the score box over the team name */
        .sb-team--home::before { inset: 0 calc(var(--skew) * -1) 0 0; }
        .sb-team--away::before { inset: 0 0 0 calc(var(--skew) * -1); }
        .sb-team--home { padding-right: 2.6vw; }
        .sb-team--away {
            flex-direction: row-reverse;
            padding: 0 1.9vw 0 2.6vw;
        }

        .sb-logo-cell {
            position: relative;
            flex: 0 0 auto;
            align-self: stretch;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.6vh 1.4vw;
        }
        .sb-logo-cell::after {
            content: "";
            position: absolute;
            top: 16%; bottom: 16%;
            width: 1px;
            background: var(--divider);
        }
        .sb-team--home .sb-logo-cell::after { right: 0; }
        .sb-team--away .sb-logo-cell::after { left: 0; }

        .sb-logo {
            width: 6vw;
            height: 6vw;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
            filter: drop-shadow(0 3px 12px rgba(0, 0, 0, 0.55));
        }
        .sb-logo.has-logo { display: block; }

        .sb-name-wrap {
            min-width: 0;
            width: fit-content;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1vh;
        }
        .sb-team--away .sb-name-wrap { align-items: flex-end; }

        .sb-name {
            font-family: var(--cond);
            font-weight: 700;
            font-size: 2.15vw;
            line-height: 0.98;
            text-transform: uppercase;
            letter-spacing: 0.015em;
            color: #fff;
            overflow-wrap: normal;
            word-break: normal;
            hyphens: none;
        }
        .sb-team--away .sb-name { text-align: right; }

        .sb-name-underline {
            width: 100%;
            height: 0.42vh;
            min-height: 3px;
            background: linear-gradient(90deg,
                color-mix(in srgb, var(--home-color) 62%, #cfe0ff),
                var(--home-color));
            box-shadow: 0 0 12px color-mix(in srgb, var(--home-color) 80%, transparent);
        }
        .sb-team--away .sb-name-underline {
            background: linear-gradient(270deg,
                color-mix(in srgb, var(--away-color) 62%, #fff4c2),
                var(--away-color));
            box-shadow: 0 0 12px color-mix(in srgb, var(--away-color) 80%, transparent);
        }

        .sb-timeout {
            display: none;   /* timeout tracking lives on the control desk */
            align-items: center;
            gap: 0.4vw;
            font-family: var(--cond);
            font-size: 0.85vw;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #8aa;
        }
        .sb-timeout::before {
            content: "";
            width: 0.5vw; height: 0.5vw;
            border-radius: 50%;
            background: #7c8aa5;
        }
        .sb-timeout .to-label { text-decoration: line-through; }

        /* ============ DIAGONAL SEGMENTS: score | clock | score ============
           Tuned for 1920x1080. Every segment is the SAME parallelogram, edges
           slanted by --skew, boxes overlapping neighbours by --skew so the cuts
           tessellate. --bar is the timebox edge-line thickness; the scorebox
           outer edge-line is half that. */
        .sb-topbar { --skew: 42px; --bar: 5px; }

        .sb-scorebox {
            position: relative;
            flex: 0 0 auto;
            width: 12vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.2vh;
            z-index: 3;
        }
        .sb-scorebox > * { position: relative; z-index: 2; }
        /* Only the OUTER slanted edge carries a line: plain team colour, half the
           thickness of the timebox line (--bar/2). The inner edge (toward the
           clock) carries nothing - the timebox's own edge line sits there. */
        .sb-scorebox {
            --sb-line: calc(var(--bar) / 2);
        }
        .sb-scorebox::after,
        .sb-scorebox::before {
            content: "";
            position: absolute;
            inset: 0;
        }
        .sb-scorebox::after  {   /* team-colour slab, full parallelogram */
            z-index: 0;
            clip-path: polygon(var(--skew) 0, 100% 0, calc(100% - var(--skew)) 100%, 0 100%);
        }
        .sb-scorebox::before {   /* dark fill on top */
            z-index: 1;
            background: linear-gradient(180deg, #16283e, #0c1a2c);
        }

        .sb-scorebox--home { margin-right: calc(var(--skew) * -1); padding: 0 34px 0 12px; }
        .sb-scorebox--home::after { background: var(--home-color); }
        .sb-scorebox--home::before {   /* inset --sb-line from the LEFT (outer) edge, flush on the RIGHT (inner) */
            clip-path: polygon(
                calc(var(--skew) + var(--sb-line)) 0,
                100% 0,
                calc(100% - var(--skew)) 100%,
                var(--sb-line) 100%);
        }

        .sb-scorebox--away { margin-left: calc(var(--skew) * -1); padding: 0 12px 0 34px; }
        .sb-scorebox--away::after { background: var(--away-color); }
        .sb-scorebox--away::before {   /* inset --sb-line from the RIGHT (outer) edge, flush on the LEFT (inner) */
            clip-path: polygon(
                var(--skew) 0,
                calc(100% - var(--sb-line)) 0,
                calc(100% - var(--skew) - var(--sb-line)) 100%,
                0 100%);
        }

        .sb-score-num {
            font-family: var(--num);
            font-weight: 700;
            font-size: 16.5vh;
            line-height: 1;
            color: #fff;
            font-variant-numeric: tabular-nums;
            /* dark halo keeps the number legible even over a bright team-colour wash */
            text-shadow:
                0 0 6px rgba(0, 0, 0, 0.85),
                0 0 20px rgba(0, 0, 0, 0.7),
                0 0.5vh 2.4vh rgba(0, 0, 0, 0.55);
        }
        .sb-sog {
            display: flex;
            align-items: baseline;
            gap: 0.4vw;
            font-family: var(--cond);
            font-size: 0.85vw;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-dim);
        }
        .sb-sog .stats-val { color: #fff; font-weight: 700; font-size: 1.05vw; }

        /* ---- centre timing module: gold parallelogram, RESTZEIT drops below ---- */
        .sb-timebox {
            position: relative;
            flex: 0 0 auto;
            width: 20vw;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 4;
        }
        .sb-timebox::after,
        .sb-timebox::before {
            content: "";
            position: absolute;
            top: 0; bottom: 0; left: 0; right: 0;
        }
        /* a line on the LEFT slanted edge (home colour) and the RIGHT slanted edge
           (away colour) only - nothing on top/bottom. Plain colour, no glow. */
        .sb-timebox::after {
            z-index: 0;
            background: linear-gradient(90deg, var(--home-color) 50%, var(--away-color) 50%);
            clip-path: polygon(var(--skew) 0, 100% 0, calc(100% - var(--skew)) 100%, 0 100%);
        }
        .sb-timebox::before {
            z-index: 1;
            background: linear-gradient(180deg, #0c1c2f, #060f1c);
            clip-path: polygon(
                calc(var(--skew) + var(--bar)) 0,
                calc(100% - var(--bar)) 0,
                calc(100% - var(--skew) - var(--bar)) 100%,
                var(--bar) 100%);
        }
        .sb-timebox-inner {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.45vh;
            transform: translateY(0.2vh);
        }

        .sb-period {
            font-family: var(--cond);
            font-weight: 600;
            font-size: 1.5vw;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: #eef3fa;
            padding-left: 0.24em;
        }
        .sb-dots {
            display: flex;
            align-items: center;
            gap: 0.7vw;
            margin: 0.4vh 0;
        }
        .sb-dot {
            width: 0.7vw;
            height: 0.7vw;
            border-radius: 50%;
            background: #42536e;
        }
        .sb-dot.done { background: #64789a; }
        .sb-dot.active {
            background: var(--gold);
            box-shadow: 0 0 13px 2px color-mix(in srgb, var(--gold) 75%, transparent);
        }
        .sb-dot.ot { width: 1.5vw; border-radius: 3px; }

        .sb-clock {
            font-family: var(--num);
            font-weight: 700;
            font-size: 9.6vh;
            line-height: 0.9;
            color: #fff;
            font-variant-numeric: tabular-nums;
        }
        .sb-clock-rule {
            width: 82%;
            height: 2px;
            margin: 0.5vh 0 0.4vh;
            background: linear-gradient(90deg, transparent, var(--gold) 12%, var(--gold) 88%, transparent);
            box-shadow: 0 0 11px color-mix(in srgb, var(--gold) 60%, transparent);
        }
        .sb-clock-caption {
            font-family: var(--cond);
            font-weight: 600;
            font-size: 1.15vw;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--gold);
            padding-left: 0.4em;
        }

        /* ------------------------------ EMPTY NET ------------------------------ */
        .sb-en-row {
            position: relative;
            height: 0;
            z-index: 7;
        }
        .sb-en {
            position: absolute;
            top: -0.4vh;
            display: inline-flex;
            align-items: center;
            gap: 0.7vw;
            padding: 0.85vh 1.5vw;
            border-radius: 3px;
            background: linear-gradient(180deg, #d03828, #9d1f13);
            font-family: var(--cond);
            font-weight: 600;
            font-size: 1.15vw;
            letter-spacing: 0.13em;
            text-transform: uppercase;
            color: #fff;
            box-shadow: 0 7px 20px -5px rgba(207, 54, 38, 0.7);
            opacity: 0;
            transform: translateY(-25%) scale(0.96);
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .sb-en::before {
            content: "";
            width: 0.8vw; height: 0.8vw;
            border-radius: 50%;
            background: #fff;
            flex-shrink: 0;
        }
        .sb-en--home { left: 2.4vw; }
        .sb-en--away { right: 2.4vw; }
        .sb-en.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            animation: enPulse 2.4s ease-in-out 0.6s infinite;
        }
        @keyframes enPulse {
            0%, 100% { box-shadow: 0 7px 20px -5px rgba(207, 54, 38, 0.7); }
            50%      { box-shadow: 0 7px 26px -3px rgba(207, 54, 38, 0.95); }
        }

        /* ------------------------------ LOWER PANEL ------------------------------
           A flex column of two bars: the MIDDLE BAR (goal scorers | sponsor |
           goal scorers, each a parallelogram; the scorer segments take a bigger
           share than the sponsor) and the PENALTY BAR below it. */
        .sb-lower {
            position: relative;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            background: linear-gradient(180deg, rgba(9, 16, 27, 0.86), rgba(6, 11, 19, 0.92));
        }
        .sb-lower::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.05;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
        }
        .sb-lower::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(107deg, transparent 38%, rgba(255, 255, 255, 0.028) 50%, transparent 62%),
                radial-gradient(120% 130% at 50% 38%, transparent 52%, rgba(0, 0, 0, 0.5));
        }

        /* ---- MIDDLE PANEL: three parallelogram segments ---- */
        .sb-midbar {
            --ph: 40vh;                                      /* parallelogram height */
            --mskew: calc(var(--ph) * var(--slant-ratio));   /* same angle as the top bar */
            position: relative;
            z-index: 1;
            flex: 0 0 auto;
            display: flex;
            align-items: stretch;
            padding: 1.5vh 2.4vw;   /* the parallelograms float clear of the screen edges */
        }

        .sb-mid {
            position: relative;
            height: var(--ph);
            min-width: 0;
            display: flex;
            flex-direction: column;
        }
        .sb-mid > * { position: relative; z-index: 2; }
        .sb-mid::after,
        .sb-mid::before {
            content: "";
            position: absolute;
            inset: 0;
        }
        /* scorer segments: plain parallelogram fill, NO edge lines on any side */
        .sb-mid--goal::after { display: none; }
        .sb-mid--goal::before {
            z-index: 1;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 22%),
                linear-gradient(180deg, #131f31, #0c1523);
            clip-path: polygon(var(--mskew) 0, 100% 0, calc(100% - var(--mskew)) 100%, 0 100%);
        }

        .sb-mid--goal    { flex: 1.7 1 0; padding: 2.6vh 3vw 2vh; }
        .sb-mid--sponsor {
            flex: 1 1 0;
            z-index: 2;
            align-items: center;
            justify-content: center;
            padding: 3vh 3.5vw;
        }
        /* sponsor: team-colour line on the left & right slanted edges only, same
           thickness (--bar) as the timebox - home hue left, away hue right.
           These double as the dividers between the three segments. */
        .sb-mid--sponsor::after {
            z-index: 0;
            background: linear-gradient(90deg, var(--home-color) 50%, var(--away-color) 50%);
            clip-path: polygon(var(--mskew) 0, 100% 0, calc(100% - var(--mskew)) 100%, 0 100%);
        }
        .sb-mid--sponsor::before {
            z-index: 1;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 22%),
                linear-gradient(180deg, #182740, #0e1a2c);
            clip-path: polygon(
                calc(var(--mskew) + var(--bar)) 0,
                calc(100% - var(--bar)) 0,
                calc(100% - var(--mskew) - var(--bar)) 100%,
                var(--bar) 100%);
        }
        .sb-mid--home { margin-right: calc(var(--mskew) * -1); padding-left: 3.5vw; padding-right: 5vw; }
        .sb-mid--away { margin-left: calc(var(--mskew) * -1); padding-left: 5vw; padding-right: 3.5vw; }

        .board-sponsor-slide {
            position: absolute;
            left: 10%; top: 14%;
            width: 80%; height: 72%;
            object-fit: contain;
            object-position: center;
            opacity: 0;
            transform: scale(0.96);
            transition: opacity 0.9s ease, transform 0.9s ease;
            filter:
                drop-shadow(0 0 10px rgba(255, 255, 255, 0.12))
                drop-shadow(0 8px 20px rgba(0, 0, 0, 0.55));
        }
        .board-sponsor-slide.visible { opacity: 1; transform: scale(1); }

        /* ---- BOTTOM PANEL: two parallelogram halves ---- */
        .sb-penbar {
            --ph: 24vh;
            --pskew: calc(var(--ph) * var(--slant-ratio));   /* same angle as the top bar */
            position: relative;
            z-index: 1;
            flex: 0 0 auto;
            display: flex;
            align-items: stretch;
            padding: 1.4vh 2.4vw;
        }
        .sb-pen {
            position: relative;
            height: var(--ph);
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            padding: 2vh 3vw 1.6vh;
        }
        .sb-pen > * { position: relative; z-index: 2; }
        /* plain parallelogram fill, NO edge lines on any side */
        .sb-pen::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent 26%),
                linear-gradient(180deg, #131f31, #0c1523);
            clip-path: polygon(var(--pskew) 0, 100% 0, calc(100% - var(--pskew)) 100%, 0 100%);
        }
        .sb-pen--home { margin-right: calc(var(--pskew) * -1); padding-left: 4.5vw; padding-right: 6vw; }
        .sb-pen--away { padding-left: 6vw; padding-right: 4.5vw; }
        .sb-pen--away .sb-lh { flex-direction: row-reverse; justify-content: flex-start; }

        /* ---- list header ---- */
        .sb-lh {
            display: flex;
            align-items: center;
            gap: 0.7vw;
            padding-bottom: 1.15vh;
            margin-bottom: 1.1vh;
            border-bottom: 1px solid var(--divider);
        }
        .sb-mid--away .sb-lh {
            flex-direction: row-reverse;
            justify-content: flex-start;
        }
        .sb-lh-text {
            font-family: var(--cond);
            font-weight: 600;
            font-size: 1.32vw;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }
        .sb-lh--goal { color: #3ad35b; }
        .sb-lh--pen  { color: #e8483a; }

        .sb-ico-goal { width: 1.7vw; height: 1.7vw; flex-shrink: 0; color: #3ad35b; display: block; }
        .sb-ico-pen {
            width: 1.15vw; height: 1.15vw;
            flex-shrink: 0;
            border-radius: 1px;
            background: #e8483a;
            box-shadow: 0 0 8px rgba(232, 72, 58, 0.55);
        }

        /* ---- rows ---- */
        .sb-rows { flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
        .sb-row {
            display: flex;
            align-items: center;
            gap: 0.85vw;
            padding: 0.55vh 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .sb-row:last-child { border-bottom: none; }
        .sb-row--empty { color: var(--text-dim); font-weight: 400; padding: 0.9vh 0; }

        /* time + number are parallelogram chips, same slant as everything else */
        .sb-tag {
            --th: 2.9vh;
            --tskew: calc(var(--th) * var(--slant-ratio));
            display: inline-flex;
            align-items: stretch;
            flex-shrink: 0;
            height: var(--th);
        }
        .sb-time,
        .sb-num {
            display: flex;
            align-items: center;
            font-style: italic;
            clip-path: polygon(var(--tskew) 0, 100% 0, calc(100% - var(--tskew)) 100%, 0 100%);
        }
        .sb-time {
            font-family: var(--num);
            font-weight: 600;
            font-size: 1.15vw;
            font-variant-numeric: tabular-nums;
            padding: 0 calc(0.8vw + var(--tskew));
        }
        .sb-num {
            font-family: var(--cond);
            font-weight: 700;
            font-size: 1.08vw;
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85), 0 0 3px rgba(0, 0, 0, 0.6);
            margin-left: calc(var(--tskew) * -1);
            padding: 0 0.72vw 0 calc(0.72vw + var(--tskew));
        }
        /* number chip in the team colour */
        .sb-mid--home .sb-num { background: var(--home-color); }
        .sb-mid--away .sb-num { background: var(--away-color); }
        .sb-name-txt {
            flex: 1;
            min-width: 0;
            font-family: var(--cond);
            font-weight: 300;
            font-style: italic;
            font-size: 1.4vw;
            letter-spacing: 0.01em;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sb-rows--goal .sb-time {
            color: #4ade80;
            background: rgba(19, 40, 29, 0.7);
            box-shadow: inset 0 0 0 1.5px rgba(74, 222, 128, 0.4);
        }
        .sb-rows--goal .sb-num { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28); }

        .sb-rows--pen .sb-time {
            color: #fff;
            font-weight: 700;
            background: linear-gradient(180deg, #c23a2b, #9c2517);
            box-shadow: inset 0 0 0 1.5px rgba(232, 72, 58, 0.5);
        }
        .sb-rows--pen .sb-num { box-shadow: inset 0 0 0 1.5px rgba(232, 72, 58, 0.35); }
        .sb-rows--pen .sb-name-txt { font-weight: 400; }

        @media (prefers-reduced-motion: reduce) {
            .sb-en, .sb-en.active, .board-sponsor-slide { transition: none; animation: none; }
        }

        /* ================= BREAK / INTERMISSION FULLSCREEN VIEW ================= */
        #breakView {
            --arena-color: #a78bfa;
            --arena-ink: #0b0f19;
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at 50% 40%,
                color-mix(in srgb, var(--arena-color) 15%, #0b0f1a) 0%,
                #050912 55%, #030712 100%);
            z-index: 500;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4vh;
            padding: 3vh 3vw;
        }
        #breakView.active { display: flex; }
        #breakView.active .arena-panel {
            animation: arenaPanelIn 0.6s cubic-bezier(0.16, 1.05, 0.3, 1) both;
        }
        #breakView.active .break-matchup {
            animation: goalRise 0.55s ease 0.2s both;
        }

        .break-header {
            position: relative;
            z-index: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.6vh;
        }
        .break-panel .arena-panel-word {
            font-size: 1.9vw;
            letter-spacing: 0.12em;
        }
        .break-clock {
            font-size: 5vw;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            color: #facc15;
            text-shadow: var(--glow-gold);
            line-height: 1;
        }

        .break-matchup {
            margin-top: 1.4vh;
            width: min(92vw, 1500px);
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 2vw;
        }
        .break-team {
            display: flex;
            align-items: center;
            gap: 1.1vw;
            min-width: 0;
        }
        .break-team--home { justify-self: end; }
        .break-team--away { justify-self: start; flex-direction: row-reverse; }
        .break-team-logo {
            width: 9vh;
            height: 9vh;
            object-fit: contain;
            flex-shrink: 0;
            filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.55));
        }
        .break-team-logo[hidden] { display: none; }
        .break-team-name {
            font-size: 1.9vw;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.15;
            text-align: center;
            overflow-wrap: break-word;
            max-width: 20vw;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
            background: rgba(0, 0, 0, 0.35);
            border-radius: 14px;
            padding: 1vh 1.6vw;
        }
        .break-scoreline {
            justify-self: center;
            display: flex;
            align-items: baseline;
            gap: 1.1vw;
            font-size: 3.6vw;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 14px;
            padding: 1vh 1.8vw;
        }
        .break-colon { color: var(--text-dim); }

        .sponsor-stage {
            flex: 0 0 auto;
            width: 72vw;
            height: 40vh;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        .sponsor-stage:has(.sponsor-slide)::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 55% 58% at center, rgba(255, 255, 255, 0.05), transparent 70%);
            filter: blur(44px);
            z-index: 0;
            pointer-events: none;
        }
        .sponsor-slide {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            filter:
                drop-shadow(0 0 16px rgba(255, 255, 255, 0.12))
                drop-shadow(0 0 38px rgba(255, 255, 255, 0.07))
                drop-shadow(0 10px 25px rgba(0, 0, 0, 0.7));
            opacity: 0;
            transition: opacity 1.2s ease-in-out, transform 1.2s ease-in-out;
            transform: scale(0.95);
        }
        .sponsor-slide.visible {
            opacity: 1;
            transform: scale(1);
        }

        /* ============ SHARED "ARENA" FURNITURE (break / time-out / goal) ============ */
        .stage-beams {
            position: absolute;
            inset: -20%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .stage-beams span {
            position: absolute;
            top: -35%; height: 170%;
            width: 5vw;
            background: linear-gradient(180deg,
                transparent,
                color-mix(in srgb, var(--arena-color, #64748b) 45%, #dbe4f3) 45%,
                transparent);
            filter: blur(7px);
            opacity: 0.22;
            animation: stageBeamSweep 15s ease-in-out infinite alternate;
        }
        .stage-beams span:nth-child(1) { left: 8%;  width: 5vw; animation-duration: 15s; animation-delay: -2s; }
        .stage-beams span:nth-child(2) { left: 27%; width: 3vw; animation-duration: 11s; animation-delay: -7s; animation-direction: alternate-reverse; }
        .stage-beams span:nth-child(3) { left: 47%; width: 7vw; animation-duration: 19s; animation-delay: -4s; }
        .stage-beams span:nth-child(4) { left: 66%; width: 3vw; animation-duration: 13s; animation-delay: -9s; animation-direction: alternate-reverse; }
        .stage-beams span:nth-child(5) { left: 85%; width: 6vw; animation-duration: 17s; animation-delay: -1s; }

        .arena-panel {
            position: relative;
            z-index: 1;
            display: inline-flex;
            transform: skewX(-9deg);
            background: var(--arena-color, #38bdf8);
            filter:
                drop-shadow(0 14px 30px rgba(0, 0, 0, 0.5))
                drop-shadow(0 0 40px color-mix(in srgb, var(--arena-color, #38bdf8) 42%, transparent));
        }
        .arena-panel-word {
            display: inline-block;
            padding: 0.75vh 2.4vw;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            line-height: 1;
            color: var(--arena-ink, #06131d);
        }
        @keyframes arenaPanelIn {
            0%   { transform: skewX(-9deg) scale(1.35) translateY(-4vh); opacity: 0; }
            60%  { opacity: 1; }
            100% { transform: skewX(-9deg) scale(1) translateY(0); opacity: 1; }
        }

        /* ============ GOAL OVERLAY - "arena" goal-horn sequence (~5 s) ============ */
        #goalOverlay {
            --goal-color: var(--accent-home);
            --goal-ink: #ffffff;
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw; height: 100vh;
            z-index: 999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            backdrop-filter: blur(10px);
            background:
                radial-gradient(circle at 50% 46%,
                    color-mix(in srgb, var(--goal-color) 30%, #05070d) 0%,
                    color-mix(in srgb, var(--goal-color) 9%, #05070d) 45%,
                    #03050b 78%);
        }
        #goalOverlay.active {
            display: flex;
            animation: goalOut 0.4s ease 5.6s both;
        }

        .goal-flash {
            position: absolute; inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
        }
        #goalOverlay.active .goal-flash { animation: goalFlash 0.5s ease-out both; }

        .goal-beams {
            position: absolute; inset: -20%;
            pointer-events: none;
            opacity: 0;
        }
        #goalOverlay.active .goal-beams { animation: goalFadeIn 0.5s ease 0.05s both; }
        .goal-beams span {
            position: absolute;
            top: -30%; height: 160%;
            width: 5vw;
            background: linear-gradient(180deg,
                transparent,
                color-mix(in srgb, var(--goal-color) 45%, #dbe4f3) 45%,
                transparent);
            filter: blur(6px);
            opacity: 0.5;
            animation: goalBeamDrift 10s ease-in-out infinite alternate;
        }
        .goal-beams span:nth-child(1) { left: 12%; animation-duration: 11s; }
        .goal-beams span:nth-child(2) { left: 31%; width: 3vw; opacity: 0.34; animation-duration: 8s; }
        .goal-beams span:nth-child(3) { left: 50%; width: 7vw; animation-duration: 13s; }
        .goal-beams span:nth-child(4) { left: 69%; width: 3vw; opacity: 0.4; animation-duration: 9.5s; }
        .goal-beams span:nth-child(5) { left: 87%; width: 5vw; animation-duration: 12s; }

        .goal-rings {
            position: absolute;
            left: 50%; top: 50%;
            width: 46vw; height: 46vw;
            margin: -23vw 0 0 -23vw;
            pointer-events: none;
        }
        .goal-rings span {
            position: absolute; inset: 0;
            border: 3px solid color-mix(in srgb, var(--goal-color) 70%, transparent);
            border-radius: 4px;
            opacity: 0;
        }
        #goalOverlay.active .goal-rings span {
            animation: goalRing 1.2s ease-out 2 both;
        }
        .goal-rings span:nth-child(1) { animation-delay: 0.9s; }
        .goal-rings span:nth-child(2) { animation-delay: 1.05s; }
        .goal-rings span:nth-child(3) { animation-delay: 1.2s; }
        .goal-rings span:nth-child(4) { animation-delay: 1.35s; }
        .goal-rings span:nth-child(5) { animation-delay: 1.5s; }

        .goal-tiles {
            position: absolute;
            inset: -25%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1.3vh;
            transform: rotate(-26deg) scale(1.15);
            opacity: 0;
            pointer-events: none;
            overflow: hidden;
        }
        #goalOverlay.active .goal-tiles { animation: goalTilesIn 0.6s ease 3.7s both; }
        .goal-tile-row {
            display: flex;
            flex-wrap: nowrap;
            gap: 2.6vw;
            width: max-content;
            will-change: translate;
        }
        #goalOverlay.active .goal-tile-row.ltr { animation: goalRowRight var(--dur, 18s) linear infinite; }
        #goalOverlay.active .goal-tile-row.rtl { animation: goalRowLeft  var(--dur, 18s) linear infinite; }
        .goal-tile {
            display: inline-flex;
            align-items: center;
            gap: 0.7vw;
            font-size: 6vh;
            font-weight: 900;
            font-style: italic;
            white-space: nowrap;
            filter: blur(1px);
            background: var(--goal-color);
            color: var(--goal-ink);
            padding: 0.4vh 1vw;
        }
        .goal-tile img { height: 5.4vh; width: 5.4vh; object-fit: contain; }

        .goal-stage {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.2vh;
        }
        #goalOverlay.active .goal-stage {
            animation: goalShake 0.5s ease-in-out 0.3s 2 both;
        }

        /* ================= TIME-OUT / AUSZEIT OVERLAY ================= */
        #timeoutOverlay {
            --arena-color: #38bdf8;
            --arena-ink: #06131d;
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at 50% 46%,
                color-mix(in srgb, var(--arena-color) 26%, #05070d) 0%,
                #04060c 72%);
            z-index: 600;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        #timeoutOverlay.active { display: flex; }
        #timeoutOverlay.active .arena-panel {
            animation: arenaPanelIn 0.6s cubic-bezier(0.16, 1.05, 0.3, 1) both;
        }
        #timeoutOverlay.active .timeout-hero-team {
            animation: goalRise 0.5s ease 0.2s both;
        }
        #timeoutOverlay.active .timeout-hero-clock {
            animation: goalRise 0.5s ease 0.32s both;
        }

        .timeout-stage {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.6vh;
        }
        .timeout-panel .arena-panel-word {
            font-size: 3.1vw;
            letter-spacing: 0.08em;
        }
        .timeout-hero-team {
            font-size: 3.4vw;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 2px 14px rgba(0, 0, 0, 0.55);
        }
        .timeout-hero-clock {
            font-size: 9vw;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            color: #facc15;
            text-shadow: var(--glow-gold);
            line-height: 1;
        }

        .goal-panel {
            position: relative;
            display: inline-flex;
            transform: skewX(-9deg);
            filter:
                drop-shadow(0 16px 34px rgba(0, 0, 0, 0.5))
                drop-shadow(0 0 46px color-mix(in srgb, var(--goal-color) 50%, transparent));
        }
        #goalOverlay.active .goal-panel {
            animation:
                goalPanelIn 1s cubic-bezier(0.16, 1.05, 0.3, 1) both,
                goalPanelSway 3.4s ease-in-out 1.8s infinite alternate;
        }

        .goal-word {
            display: inline-flex;
            gap: 0.5vw;
            font-size: min(13vw, 21vh);
            font-weight: 900;
            font-style: italic;
            line-height: 0.9;
        }
        .goal-letter {
            display: inline-block;
            padding: 1.2vh 1vw;
            background: var(--goal-color);
            color: transparent;
            -webkit-text-stroke: 2px color-mix(in srgb, var(--goal-ink) 72%, var(--goal-color));
            box-shadow: inset 0 0 0 1px color-mix(in srgb, #ffffff 20%, transparent);
        }
        .goal-letter:nth-child(1) { --plank-y: 0.9vh; }
        .goal-letter:nth-child(2) { --plank-y: -1.2vh; }
        .goal-letter:nth-child(3) { --plank-y: 1.3vh; }
        .goal-letter:nth-child(4) { --plank-y: -0.7vh; }
        .goal-letter:nth-child(5) { --plank-y: 1.1vh; }
        #goalOverlay.active .goal-letter {
            animation:
                goalLetterFill 0.45s ease forwards,
                goalLetterPlank 0.6s cubic-bezier(0.22, 1, 0.36, 1) 1.5s both;
        }
        #goalOverlay.active .goal-letter:nth-child(1) { animation-delay: 0.42s, 1.48s; }
        #goalOverlay.active .goal-letter:nth-child(2) { animation-delay: 0.53s, 1.55s; }
        #goalOverlay.active .goal-letter:nth-child(3) { animation-delay: 0.64s, 1.62s; }
        #goalOverlay.active .goal-letter:nth-child(4) { animation-delay: 0.75s, 1.69s; }
        #goalOverlay.active .goal-letter:nth-child(5) { animation-delay: 0.86s, 1.76s; }

        .goal-hero-scorer {
            max-width: min(88vw, 1200px);
            padding: 0.7vh 2.4vw;
            transform: skewX(-9deg);
            background: var(--goal-color);
            color: var(--goal-ink);
            font-size: clamp(0.95rem, 2.5vw, 2.6rem);
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            line-height: 1.12;
            text-align: center;
            overflow-wrap: break-word;
            filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.45));
        }
        .goal-hero-scorer:empty { display: none; }
        #goalOverlay.active .goal-hero-scorer {
            animation: goalScorerIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) 1.5s both;
        }

        @keyframes goalFlash {
            0%   { opacity: 0; }
            18%  { opacity: 0.85; }
            100% { opacity: 0; }
        }
        @keyframes goalFadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes goalOut { from { opacity: 1; } to { opacity: 0; } }
        @keyframes goalBeamDrift {
            from { transform: rotate(11deg) translateY(-7%); }
            to   { transform: rotate(13deg) translateY(7%); }
        }
        @keyframes stageBeamSweep {
            0%   { transform: rotate(7deg)  translateX(-9vw) scaleY(0.9); opacity: 0.07; }
            35%  { opacity: 0.30; }
            65%  { opacity: 0.28; }
            100% { transform: rotate(16deg) translateX(10vw) scaleY(1.06); opacity: 0.10; }
        }
        @keyframes goalRing {
            0%   { opacity: 0; transform: skewX(-9deg) scale(0.15); }
            15%  { opacity: 0.9; }
            100% { opacity: 0; transform: skewX(-9deg) scale(2.4); }
        }
        @keyframes goalPanelIn {
            0%   { transform: skewX(-9deg) scale(1.9) rotate(-3deg); opacity: 0; }
            16%  { opacity: 1; }
            34%  { transform: skewX(-9deg) scale(0.9) rotate(0deg); }
            50%  { transform: skewX(-9deg) scale(1.18); }
            66%  { transform: skewX(-9deg) scale(0.97); }
            100% { transform: skewX(-9deg) scale(1); opacity: 1; }
        }
        @keyframes goalPanelSway {
            0%   { transform: skewX(-9deg) rotate(-1.2deg); }
            100% { transform: skewX(-9deg) rotate(1.2deg); }
        }
        @keyframes goalLetterFill { to { color: var(--goal-ink); } }
        @keyframes goalScorerIn {
            from { clip-path: inset(0 100% 0 0); opacity: 0; transform: skewX(-9deg) translateY(1.4vh); }
            to   { clip-path: inset(0 0 0 0);   opacity: 1; transform: skewX(-9deg) translateY(0); }
        }
        @keyframes goalLetterPlank {
            from { transform: translateY(0) rotate(0deg); }
            to   { transform: translateY(var(--plank-y, 0)) rotate(-1.5deg); }
        }
        @keyframes goalShake {
            0%, 100% { transform: translate(0, 0); }
            25%      { transform: translate(-0.6vw, 0.3vh); }
            50%      { transform: translate(0.5vw, -0.2vh); }
            75%      { transform: translate(-0.3vw, 0.35vh); }
        }
        @keyframes goalRise {
            from { transform: translateY(1.8vh); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }
        @keyframes goalTilesIn { from { opacity: 0; } to { opacity: 0.32; } }
        @keyframes goalRowRight { from { translate: -50% 0; } to { translate: 0 0; } }
        @keyframes goalRowLeft { from { translate: 0 0; } to { translate: -50% 0; } }

        @media (prefers-reduced-motion: reduce) {
            #goalOverlay.active,
            #goalOverlay.active .goal-flash,
            #goalOverlay.active .goal-beams,
            #goalOverlay.active .goal-beams span,
            #goalOverlay.active .goal-rings span,
            #goalOverlay.active .goal-panel,
            #goalOverlay.active .goal-stage,
            #goalOverlay.active .goal-letter,
            #goalOverlay.active .goal-hero-scorer,
            #goalOverlay.active .goal-tiles,
            #goalOverlay.active .goal-tile-row,
            #breakView.active .stage-beams span,
            #breakView.active .arena-panel,
            #breakView.active .break-matchup,
            #timeoutOverlay.active .stage-beams span,
            #timeoutOverlay.active .arena-panel,
            #timeoutOverlay.active .timeout-hero-team,
            #timeoutOverlay.active .timeout-hero-clock {
                animation: none !important;
            }
            #goalOverlay .goal-letter { color: var(--goal-ink); }
            #goalOverlay .goal-beams,
            #goalOverlay .goal-tiles,
            .stage-beams { opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- MATCH VIEW -->
    <div id="matchView">
        <div class="sb" id="boardPanel">

            <!-- TOP BAR -->
            <div class="sb-topbar">
                <div class="sb-team sb-team--home">
                    <div class="sb-logo-cell">
                        <img id="homeLogo" class="sb-logo" src="" alt="">
                    </div>
                    <div class="sb-name-wrap">
                        <div class="sb-name" id="homeName">HEIM</div>
                        <div class="sb-name-underline"></div>
                        <div class="sb-timeout" id="homeTimeout" hidden><span class="to-label">Auszeit</span></div>
                    </div>
                </div>

                <div class="sb-scorebox sb-scorebox--home">
                    <div class="sb-score-num" id="homeScore" style="color: var(--text-main);">0</div>
                    <div class="sb-sog" id="homeStatsRow" style="display:none;">
                        <span>Schüsse</span><span class="stats-val" id="homeShots">0</span>
                    </div>
                </div>

                <div class="sb-timebox">
                    <div class="sb-timebox-inner">
                        <div class="sb-period" id="periodDisplay">DRITTEL 1</div>
                        <div class="sb-dots" id="periodDots"></div>
                        <div class="sb-clock" id="clockDisplay">15:00</div>
                        <div class="sb-clock-rule"></div>
                        <div class="sb-clock-caption" id="timeFormatLabel">RESTZEIT</div>
                    </div>
                </div>

                <div class="sb-scorebox sb-scorebox--away">
                    <div class="sb-score-num" id="awayScore" style="color: var(--text-main);">0</div>
                    <div class="sb-sog" id="awayStatsRow" style="display:none;">
                        <span>Schüsse</span><span class="stats-val" id="awayShots">0</span>
                    </div>
                </div>

                <div class="sb-team sb-team--away">
                    <div class="sb-logo-cell">
                        <img id="awayLogo" class="sb-logo" src="" alt="">
                    </div>
                    <div class="sb-name-wrap">
                        <div class="sb-name" id="awayName">GAST</div>
                        <div class="sb-name-underline"></div>
                        <div class="sb-timeout" id="awayTimeout" hidden><span class="to-label">Auszeit</span></div>
                    </div>
                </div>
            </div>

            <!-- EMPTY-NET badges (overlap the seam) -->
            <div class="sb-en-row">
                <div class="sb-en sb-en--home" id="homeEmptyNet">Empty Net</div>
                <div class="sb-en sb-en--away" id="awayEmptyNet">Empty Net</div>
            </div>

            <!-- LOWER PANEL: middle bar (scorers | sponsor | scorers) + penalty bar -->
            <div class="sb-lower">

                <div class="sb-midbar">
                    <div class="sb-mid sb-mid--goal sb-mid--home">
                        <div class="sb-lh sb-lh--goal">
                            <svg class="sb-ico-goal" viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="2"></circle>
                                <path d="M12 1.5v4.5M12 18v4.5M1.5 12h4.5M18 12h4.5" stroke="currentColor" stroke-width="2"></path>
                            </svg>
                            <span class="sb-lh-text">Tor Schützen</span>
                        </div>
                        <div class="sb-rows sb-rows--goal" id="homeGoalTrack"></div>
                    </div>

                    <div class="sb-mid sb-mid--sponsor" id="boardSponsorSlot"></div>

                    <div class="sb-mid sb-mid--goal sb-mid--away">
                        <div class="sb-lh sb-lh--goal">
                            <svg class="sb-ico-goal" viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="2"></circle>
                                <path d="M12 1.5v4.5M12 18v4.5M1.5 12h4.5M18 12h4.5" stroke="currentColor" stroke-width="2"></path>
                            </svg>
                            <span class="sb-lh-text">Tor Schützen</span>
                        </div>
                        <div class="sb-rows sb-rows--goal" id="awayGoalTrack"></div>
                    </div>
                </div>

                <div class="sb-penbar">
                    <div class="sb-pen sb-pen--home">
                        <div class="sb-lh sb-lh--pen">
                            <span class="sb-ico-pen" aria-hidden="true"></span>
                            <span class="sb-lh-text">Strafen</span>
                        </div>
                        <div class="sb-rows sb-rows--pen" id="homePenaltyTrack"></div>
                    </div>
                    <div class="sb-pen sb-pen--away">
                        <div class="sb-lh sb-lh--pen">
                            <span class="sb-ico-pen" aria-hidden="true"></span>
                            <span class="sb-lh-text">Strafen</span>
                        </div>
                        <div class="sb-rows sb-rows--pen" id="awayPenaltyTrack"></div>
                    </div>
                </div>
            </div>

            <div class="sb-glow"></div>
        </div>
    </div>

    <!-- BREAK / INTERMISSION FULLSCREEN VIEW -->
    <div id="breakView">
        <div class="stage-beams" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
        <div class="break-header">
            <div class="arena-panel break-panel"><span class="arena-panel-word">Drittelpause</span></div>
            <div class="break-clock" id="breakClockDisplay">05:00</div>
            <div class="break-matchup">
                <div class="break-team break-team--home">
                    <img class="break-team-logo" id="breakHomeLogo" src="" alt="" hidden>
                    <span class="break-team-name" id="breakHomeName">HEIM</span>
                </div>
                <div class="break-scoreline">
                    <span id="breakHomeScore">0</span>
                    <span class="break-colon">:</span>
                    <span id="breakAwayScore">0</span>
                </div>
                <div class="break-team break-team--away">
                    <img class="break-team-logo" id="breakAwayLogo" src="" alt="" hidden>
                    <span class="break-team-name" id="breakAwayName">GAST</span>
                </div>
            </div>
        </div>

        <div class="sponsor-stage" id="sponsorStage">
            <div style="color: var(--text-dim); font-size: 1.5vw;" id="noSponsorsNotice">Präsentiert von unseren Sponsoren</div>
        </div>
    </div>

    <!-- TIME-OUT / AUSZEIT OVERLAY -->
    <div id="timeoutOverlay">
        <div class="stage-beams" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
        <div class="timeout-stage">
            <div class="arena-panel timeout-panel"><span class="arena-panel-word">⏱ Auszeit</span></div>
            <div class="timeout-hero-team" id="timeoutHeroTeam">HEIM</div>
            <div class="timeout-hero-clock" id="timeoutHeroClock">01:00</div>
        </div>
    </div>

    <!-- GOAL OVERLAY -->
    <div id="goalOverlay">
        <div class="goal-flash"></div>
        <div class="goal-beams"><span></span><span></span><span></span><span></span><span></span></div>
        <div class="goal-rings"><span></span><span></span><span></span><span></span><span></span></div>
        <div class="goal-tiles" id="goalTiles" aria-hidden="true"></div>
        <div class="goal-stage">
            <div class="goal-panel">
                <span class="goal-word"><span class="goal-letter">G</span><span class="goal-letter">O</span><span class="goal-letter">A</span><span class="goal-letter">L</span><span class="goal-letter">!</span></span>
            </div>
            <div class="goal-hero-scorer" id="goalHeroScorer"></div>
        </div>
    </div>

    <script>
        let ws;
        let sponsorsList = [];
        let sponsorIndex = 0;
        let sponsorInterval = null;
        let goalTimeout = null;

        function escapeHtml(s) {
            return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
                { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
            ));
        }

        function safeUploadUrl(url) {
            const u = String(url || "");
            return (u.startsWith("/uploads/") || u.startsWith("data:image/")) ? u : "";
        }

        function safeColor(c) {
            const v = String(c || "").trim();
            return /^(#[0-9a-fA-F]{3,8}|[a-zA-Z]+|rgba?\([\d.,\s%]+\))$/.test(v) ? v : "";
        }

        // "20 Max Meermann" / "#20 Max Meermann" -> { num: "#20", name: "Max Meermann" }
        function splitPlayer(p) {
            const str = String(p == null ? "" : p).trim();
            const m = /^#?(\d+)[\s.]*(.*)$/.exec(str);
            if (m && m[1]) return { num: "#" + m[1], name: (m[2] || "").trim() || ("#" + m[1]) };
            return { num: "", name: str };
        }

        function connectWS() {
            const loc = window.location;
            const wsProtocol = loc.protocol === "https:" ? "wss:" : "ws:";
            const wsUrl = `${wsProtocol}//${loc.host}/ws`;
            ws = new WebSocket(wsUrl);
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === "STATE_UPDATE") renderState(msg.state);
                else if (msg.type === "goal") showGoalOverlay(msg);
                else if (msg.type === "SPONSORS_UPDATE") loadSponsors();
            };
            ws.onclose = () => setTimeout(connectWS, 1500);
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function renderPeriodDots(s) {
            const el = document.getElementById("periodDots");
            if (!el) return;
            if (s.shootout_active) { el.innerHTML = ""; return; }
            const isOT = s.period === "OT";
            const cur = isOT ? 4 : (parseInt(s.period, 10) || 1);
            let html = "";
            for (let i = 1; i <= 3; i++) {
                const cls = i < cur ? "done" : (i === cur ? "active" : "");
                html += `<span class="sb-dot ${cls}"></span>`;
            }
            if (isOT) html += `<span class="sb-dot ot active"></span>`;
            el.innerHTML = html;
        }

        function renderState(s) {
            document.getElementById("clockDisplay").innerText = formatTime(s.time_remaining);
            if (s.shootout_active) {
                const hg = (s.home_shootout || []).filter(a => a.scored).length;
                const ag = (s.away_shootout || []).filter(a => a.scored).length;
                document.getElementById("periodDisplay").innerText = `PENALTYSCHIESSEN ${hg} : ${ag}`;
            } else {
                document.getElementById("periodDisplay").innerText = s.period === "OT" ? "OVERTIME" : `DRITTEL ${s.period}`;
            }
            renderPeriodDots(s);

            const showShots = s.show_shots === true;
            document.getElementById("homeStatsRow").style.display = showShots ? "flex" : "none";
            document.getElementById("awayStatsRow").style.display = showShots ? "flex" : "none";

            document.getElementById("homeEmptyNet").classList.toggle("active", s.home_goalie === false);
            document.getElementById("awayEmptyNet").classList.toggle("active", s.away_goalie === false);

            const hTO = (s.home_timeouts_used || 0) > 0;
            const aTO = (s.away_timeouts_used || 0) > 0;
            document.getElementById("homeTimeout").hidden = !hTO;
            document.getElementById("awayTimeout").hidden = !aTO;

            const toOverlay = document.getElementById("timeoutOverlay");
            if (s.timeout_active) {
                const tt = s.timeout_team === "away" ? "away" : "home";
                toOverlay.style.setProperty("--arena-color",
                    safeColor(s[tt + "_color"]) ||
                    (tt === "away" ? "var(--accent-away)" : "var(--accent-home)"));
                toOverlay.style.setProperty("--arena-ink", readableInk(safeColor(s[tt + "_color"])));
                const tTeamEl = document.getElementById("timeoutHeroTeam");
                tTeamEl.innerText = tt === "away" ? s.away_name : s.home_name;
                tTeamEl.style.color = safeColor(s[tt + "_text_color"]) || "var(--text-main)";
                document.getElementById("timeoutHeroClock").innerText = formatTime(s.timeout_time_remaining || 0);
                toOverlay.classList.add("active");
            } else {
                toOverlay.classList.remove("active");
            }

            // Home identity
            document.getElementById("homeName").innerText = s.home_name;
            document.getElementById("homeName").style.color = safeColor(s.home_text_color) || 'var(--text-main)';
            document.getElementById("homeScore").innerText = s.home_score;
            document.getElementById("homeShots").innerText = s.home_shots;
            document.getElementById("homeScore").style.color = safeColor(s.home_text_color) || 'var(--text-main)';
            document.getElementById("boardPanel").style.setProperty('--home-color', safeColor(s.home_color) || 'var(--accent-home)');
            document.querySelector(".sb-topbar").style.setProperty('--home-color', safeColor(s.home_color) || 'var(--accent-home)');

            const homeLogo = document.getElementById("homeLogo");
            if (s.home_logo) { homeLogo.src = s.home_logo; homeLogo.classList.add("has-logo"); }
            else homeLogo.classList.remove("has-logo");

            // Away identity
            document.getElementById("awayName").innerText = s.away_name;
            document.getElementById("awayName").style.color = safeColor(s.away_text_color) || 'var(--text-main)';
            document.getElementById("awayScore").innerText = s.away_score;
            document.getElementById("awayShots").innerText = s.away_shots;
            document.getElementById("awayScore").style.color = safeColor(s.away_text_color) || 'var(--text-main)';
            document.getElementById("boardPanel").style.setProperty('--away-color', safeColor(s.away_color) || 'var(--accent-away)');
            document.querySelector(".sb-topbar").style.setProperty('--away-color', safeColor(s.away_color) || 'var(--accent-away)');

            const awayLogo = document.getElementById("awayLogo");
            if (s.away_logo) { awayLogo.src = s.away_logo; awayLogo.classList.add("has-logo"); }
            else awayLogo.classList.remove("has-logo");

            renderTeamEvents("home", s.home_penalties || [], s.home_goals || []);
            renderTeamEvents("away", s.away_penalties || [], s.away_goals || []);

            const breakView = document.getElementById("breakView");
            if (s.break_mode) {
                if (!breakView.classList.contains("active")) loadSponsors();
                breakView.classList.add("active");
                document.getElementById("breakClockDisplay").innerText = formatTime(s.break_time_remaining || 0);
                renderBreakTeam("home", s);
                renderBreakTeam("away", s);
                startSponsorSlideshow();
            } else {
                breakView.classList.remove("active");
                stopSponsorSlideshow();
            }
        }

        function renderBreakTeam(side, s) {
            const cap = side.charAt(0).toUpperCase() + side.slice(1);
            const fallback = side === "home" ? "HEIM" : "GAST";
            document.getElementById("break" + cap + "Name").innerText = s[side + "_name"] || fallback;
            const scoreEl = document.getElementById("break" + cap + "Score");
            scoreEl.innerText = s[side + "_score"];
            scoreEl.style.color = safeColor(s[side + "_color"]) ||
                (side === "home" ? "var(--accent-home)" : "var(--accent-away)");
            const logo = document.getElementById("break" + cap + "Logo");
            const src = s[side + "_logo"];
            if (src) { logo.src = src; logo.hidden = false; }
            else { logo.hidden = true; logo.removeAttribute("src"); }
        }

        // ================= LIST CARDS =================
        const MAX_GOAL_ROWS = 5;
        const MAX_PEN_ROWS = 4;

        function renderTeamEvents(side, penalties, goals) {
            const pens = [...penalties]
                .sort((a, b) => (a.remaining_seconds || 0) - (b.remaining_seconds || 0))
                .slice(0, MAX_PEN_ROWS)
                .map(p => {
                    const sp = splitPlayer(p.player);
                    return { time: formatTime(p.remaining_seconds || 0), num: sp.num, name: sp.name };
                });
            const gs = [...goals].reverse().slice(0, MAX_GOAL_ROWS).map(g => {
                const sp = splitPlayer(g.player);
                return { time: String(g.time || ""), num: sp.num, name: sp.name };
            });
            renderRows(side + "Goal", gs);
            renderRows(side + "Penalty", pens);
        }

        function renderRows(key, rows) {
            const body = document.getElementById(key + "Track");
            if (!body) return;
            if (rows.length === 0) {
                body.innerHTML = `<div class="sb-row sb-row--empty">&ndash;</div>`;
                return;
            }
            body.innerHTML = rows.map(r => `
                <div class="sb-row">
                    <span class="sb-tag">
                        <span class="sb-time">${escapeHtml(r.time)}</span>
                        ${r.num ? `<span class="sb-num">${escapeHtml(r.num)}</span>` : ``}
                    </span>
                    <span class="sb-name-txt">${escapeHtml(r.name)}</span>
                </div>
            `).join('');
        }

        // ================= GOAL OVERLAY =================
        function readableInk(color) {
            const m = /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.exec(String(color || "").trim());
            if (!m) return "#ffffff";
            let h = m[1];
            if (h.length === 3) h = h.split("").map(c => c + c).join("");
            const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
            const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            return lum > 0.62 ? "#0b0f19" : "#ffffff";
        }

        function showGoalOverlay(data) {
            const overlay = document.getElementById("goalOverlay");
            const scorerEl = document.getElementById("goalHeroScorer");
            const tilesEl = document.getElementById("goalTiles");
            const goalColor = safeColor(data.color) ||
                (data.team === "away" ? "var(--accent-away)" : "var(--accent-home)");
            overlay.style.setProperty("--goal-color", goalColor);
            overlay.style.setProperty("--goal-ink", readableInk(safeColor(data.color)));

            const scorerBits = [];
            if (data.scorer) scorerBits.push(String(data.scorer));
            if (data.empty_net) scorerBits.push("Empty Net");
            scorerEl.innerText = scorerBits.join("  ·  ");

            const logoSrc = safeUploadUrl(data.team_logo);
            const cell = logoSrc
                ? `<span class="goal-tile"><img src="${escapeHtml(logoSrc)}" alt=""><b>GOAL!</b></span>`
                : `<span class="goal-tile"><b>GOAL!</b></span>`;
            const rowInner = cell.repeat(28);
            let rows = "";
            for (let i = 0; i < 16; i++) {
                rows += `<div class="goal-tile-row ${i % 2 ? "rtl" : "ltr"}" style="--dur:${18 + (i % 4) * 4}s">${rowInner}</div>`;
            }
            tilesEl.innerHTML = rows;

            overlay.classList.remove("active");
            void overlay.offsetWidth;
            overlay.classList.add("active");
            if (goalTimeout) clearTimeout(goalTimeout);
            goalTimeout = setTimeout(() => overlay.classList.remove("active"), 6000);
        }

        // ================= SPONSORS =================
        async function loadSponsors() {
            try {
                const res = await fetch("/api/sponsors", { cache: "no-store" });
                sponsorsList = await res.json();
                sponsorIndex = 0;
                buildSponsorElements();
                if (document.getElementById("breakView").classList.contains("active")) {
                    stopSponsorSlideshow();
                    startSponsorSlideshow();
                }
                updateBoardSponsors();
            } catch (e) {
                console.error("Error loading sponsors:", e);
            }
        }

        let boardSponsorIndex = 0;
        let boardSponsorInterval = null;
        const BOARD_SPONSOR_MS = 7000;

        function updateBoardSponsors() {
            const slot = document.getElementById("boardSponsorSlot");
            const panel = document.getElementById("boardPanel");
            const list = sponsorsList || [];
            panel.classList.toggle("has-sponsor", list.length > 0);
            stopBoardSponsorRotation();
            if (list.length === 0) { slot.innerHTML = ""; return; }
            boardSponsorIndex = 0;
            slot.innerHTML = list.map((sp, i) => `
                <img src="${escapeHtml(safeUploadUrl(sp.url))}" alt="${escapeHtml(sp.name || '')}"
                     class="board-sponsor-slide ${i === 0 ? 'visible' : ''}" id="boardSponsor_${i}">
            `).join('');
            startBoardSponsorRotation();
        }

        function startBoardSponsorRotation() {
            if (boardSponsorInterval || (sponsorsList || []).length <= 1) return;
            boardSponsorInterval = setInterval(() => {
                const total = sponsorsList.length;
                if (total <= 1) return;
                const prev = document.getElementById(`boardSponsor_${boardSponsorIndex}`);
                if (prev) prev.classList.remove("visible");
                boardSponsorIndex = (boardSponsorIndex + 1) % total;
                const next = document.getElementById(`boardSponsor_${boardSponsorIndex}`);
                if (next) next.classList.add("visible");
            }, BOARD_SPONSOR_MS);
        }

        function stopBoardSponsorRotation() {
            if (boardSponsorInterval) { clearInterval(boardSponsorInterval); boardSponsorInterval = null; }
        }

        function buildSponsorElements() {
            const stage = document.getElementById("sponsorStage");
            if (!sponsorsList || sponsorsList.length === 0) {
                stage.innerHTML = '<div style="color: var(--text-dim); font-size: 1.5vw;" id="noSponsorsNotice">Präsentiert von unseren Sponsoren</div>';
                return;
            }
            stage.innerHTML = sponsorsList.map((s, idx) => `
                <img src="${escapeHtml(safeUploadUrl(s.url))}" alt="${escapeHtml(s.name || '')}" class="sponsor-slide ${idx === 0 ? 'visible' : ''}" id="sponsorSlide_${idx}">
            `).join('');
        }

        function startSponsorSlideshow() {
            if (sponsorInterval || sponsorsList.length <= 1) return;
            sponsorInterval = setInterval(() => {
                const total = sponsorsList.length;
                if (total <= 1) return;
                const prev = document.getElementById(`sponsorSlide_${sponsorIndex}`);
                if (prev) prev.classList.remove("visible");
                sponsorIndex = (sponsorIndex + 1) % total;
                const next = document.getElementById(`sponsorSlide_${sponsorIndex}`);
                if (next) next.classList.add("visible");
            }, 4000);
        }

        function stopSponsorSlideshow() {
            if (sponsorInterval) { clearInterval(sponsorInterval); sponsorInterval = null; }
        }

        connectWS();
        loadSponsors();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard Display | Großanzeige</title>
    <style>
        :root {
            --bg-dark: #070a12;
            --surface-bg: #111726;
            --surface-card: #182238;
            --border: #23314e;
            --accent-home: #ef4444;
            --accent-away: #00d2ff;
            --text-main: #ffffff;
            --text-dim: #8fa0be;
            --glow-gold: 0 0 35px rgba(250, 204, 21, 0.45);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 1.5vw;
        }

        /* FULLSCREEN LIVE SCOREBOARD LAYOUT */
        #matchView {
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 1.5vh;
            height: 100%;
            width: 100%;
        }

        /* TOP HEADER BAR */
        .top-bar {
            display: grid;
            grid-template-columns: 1fr 1.6fr 1fr;
            align-items: center;
            background: var(--surface-bg);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 1vh 2vw;
        }

        .period-box {
            text-align: center;
            font-size: 1.8vw;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #facc15;
        }

        .main-clock {
            text-align: center;
            font-size: 5.5vw;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            color: #facc15;
            text-shadow: var(--glow-gold);
            line-height: 1;
        }

        /* MAIN TEAMS & SCORE AREA */
        .teams-container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 2vw;
            align-items: center;
            height: 100%;
        }

        .team-card {
            background: var(--surface-bg);
            border: 2px solid var(--border);
            border-radius: 20px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2.5vh 2vw;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .team-card-home { border-top: 8px solid var(--accent-home); }
        .team-card-away { border-top: 8px solid var(--accent-away); }

        .team-identity {
            display: flex;
            align-items: center;
            gap: 1.5vw;
        }

        .team-logo {
            width: 7vw;
            height: 7vw;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
            display: none;
        }
        .team-logo.has-logo { display: block; }

        .team-name {
            font-size: 2.8vw;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.1;
        }

        .team-score {
            font-size: 13vw;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            text-align: center;
            line-height: 0.95;
            margin: auto 0;
            text-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }

        .team-stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 0.8vh 1.2vw;
            font-size: 1.2vw;
            font-weight: 700;
            color: var(--text-dim);
        }

        .stats-val {
            color: #fff;
            font-weight: 900;
        }

        .vs-divider {
            font-size: 3vw;
            font-weight: 900;
            color: var(--text-dim);
            opacity: 0.4;
        }

        /* LOWER INFO BAR: PENALTIES & SCORERS */
        .bottom-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2vw;
            min-height: 12vh;
            max-height: 16vh;
        }

        .info-panel {
            background: var(--surface-bg);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 1vh 1.4vw;
            display: flex;
            flex-direction: column;
            gap: 0.5vh;
            overflow: hidden;
        }

        .info-title {
            font-size: 0.9vw;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.3vh;
        }

        .ticker-list {
            display: flex;
            gap: 1vw;
            overflow-x: auto;
            white-space: nowrap;
            align-items: center;
            height: 100%;
        }

        .penalty-badge {
            background: #ef4444;
            color: white;
            font-size: 1.1vw;
            font-weight: 800;
            padding: 0.4vh 0.8vw;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 0.5vw;
        }

        .goal-badge {
            background: #10b981;
            color: white;
            font-size: 1vw;
            font-weight: 800;
            padding: 0.3vh 0.7vw;
            border-radius: 6px;
        }

        /* ================= BREAK / INTERMISSION FULLSCREEN VIEW ================= */
        #breakView {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            z-index: 500;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 3vh 3vw;
        }
        #breakView.active { display: flex; }

        .break-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 0.5vh;
        }
        .break-title {
            font-size: 2.2vw;
            font-weight: 900;
            letter-spacing: 4px;
            color: #a78bfa;
            text-transform: uppercase;
        }
        .break-clock {
            font-size: 7.5vw;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            color: #facc15;
            text-shadow: var(--glow-gold);
            line-height: 1;
        }
        .break-score-summary {
            font-size: 2vw;
            font-weight: 800;
            color: #cbd5e1;
        }

        /* SPONSOR SLIDESHOW CONTAINER */
        .sponsor-stage {
            flex: 1;
            width: 85vw;
            max-height: 52vh;
            margin: 2vh auto;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .sponsor-slide {
            position: absolute;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 25px rgba(0,0,0,0.7));
            opacity: 0;
            transition: opacity 1.2s ease-in-out, transform 1.2s ease-in-out;
            transform: scale(0.95);
        }
        .sponsor-slide.visible {
            opacity: 1;
            transform: scale(1);
        }

        /* ================= 5-SECOND GOAL OVERLAY ================= */
        #goalOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(8px);
            z-index: 999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }
        #goalOverlay.active { display: flex; }

        .goal-hero-title {
            font-size: 10vw;
            font-weight: 900;
            color: #facc15;
            text-shadow: 0 0 50px rgba(250, 204, 21, 0.8);
            letter-spacing: 6px;
            animation: pulseText 0.8s infinite alternate;
        }

        .goal-hero-team {
            font-size: 4vw;
            font-weight: 900;
            text-transform: uppercase;
            margin-top: 1vh;
        }

        .goal-hero-scorer {
            font-size: 3vw;
            font-weight: 800;
            color: #38bdf8;
            margin-top: 2vh;
            background: rgba(56, 189, 248, 0.15);
            padding: 1vh 3vw;
            border-radius: 50px;
            border: 2px solid #38bdf8;
        }

        .goal-hero-logo {
            width: 12vw;
            height: 12vw;
            object-fit: contain;
            margin-top: 2vh;
        }

        @keyframes pulseText {
            0% { transform: scale(0.96); }
            100% { transform: scale(1.04); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- MATCH VIEW -->
    <div id="matchView">
        
        <!-- TOP BAR -->
        <div class="top-bar">
            <div class="period-box" id="periodDisplay">DRITTEL 1</div>
            <div class="main-clock" id="clockDisplay">15:00</div>
            <div style="text-align: right; font-size: 1.1vw; font-weight: 800; color: var(--text-dim);" id="timeFormatLabel">RESTZEIT</div>
        </div>

        <!-- MAIN TEAMS & SCORE -->
        <div class="teams-container">
            <!-- HOME -->
            <div class="team-card team-card-home" id="homeCard">
                <div class="team-identity">
                    <img id="homeLogo" class="team-logo" src="" alt="Home Logo">
                    <div class="team-name" id="homeName">HEIM</div>
                </div>
                <div class="team-score" id="homeScore" style="color: var(--accent-home);">0</div>
                <div class="team-stats-row">
                    <span>SCHÜSSE</span>
                    <span class="stats-val" id="homeShots">0</span>
                </div>
            </div>

            <div class="vs-divider">:</div>

            <!-- AWAY -->
            <div class="team-card team-card-away" id="awayCard">
                <div class="team-identity">
                    <img id="awayLogo" class="team-logo" src="" alt="Away Logo">
                    <div class="team-name" id="awayName">GAST</div>
                </div>
                <div class="team-score" id="awayScore" style="color: var(--accent-away);">0</div>
                <div class="team-stats-row">
                    <span>SCHÜSSE</span>
                    <span class="stats-val" id="awayShots">0</span>
                </div>
            </div>
        </div>

        <!-- LOWER BAR: PENALTIES & SCORERS -->
        <div class="bottom-bar">
            <div class="info-panel">
                <div class="info-title">STRAFZEITEN (PENALTIES)</div>
                <div class="ticker-list" id="penaltyList">
                    <span style="color: var(--text-dim); font-size: 1vw;">Keine aktiven Strafen</span>
                </div>
            </div>

            <div class="info-panel">
                <div class="info-title">LETZTE TORE (GOAL SCORERS)</div>
                <div class="ticker-list" id="goalsList">
                    <span style="color: var(--text-dim); font-size: 1vw;">Noch keine Tore</span>
                </div>
            </div>
        </div>

    </div>

    <!-- BREAK / INTERMISSION FULLSCREEN VIEW -->
    <div id="breakView">
        <div class="break-header">
            <div class="break-title">☕ DRITTELPAUSE</div>
            <div class="break-clock" id="breakClockDisplay">05:00</div>
            <div class="break-score-summary" id="breakScoreSummary">HEIM 0 : 0 GAST</div>
        </div>

        <div class="sponsor-stage" id="sponsorStage">
            <!-- Sponsor images injected dynamically -->
            <div style="color: var(--text-dim); font-size: 1.5vw;" id="noSponsorsNotice">Präsentiert von unseren Sponsoren</div>
        </div>
    </div>

    <!-- 5-SEC GOAL OVERLAY -->
    <div id="goalOverlay">
        <div class="goal-hero-title">🚨 TOOOOOR! 🚨</div>
        <img id="goalHeroLogo" class="goal-hero-logo" src="" alt="" style="display:none;">
        <div class="goal-hero-team" id="goalHeroTeam">HEIMTEAM</div>
        <div class="goal-hero-scorer" id="goalHeroScorer">#10 Max Mustermann</div>
    </div>

    <!-- AUDIO FOR BUZZER & GOAL HORN -->
    <audio id="hornSound" preload="auto">
        <source src="data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YV9vT18A" type="audio/wav">
    </audio>

    <script>
        let ws;
        let sponsorsList = [];
        let sponsorIndex = 0;
        let sponsorInterval = null;
        let goalTimeout = null;

        function connectWS() {
            const loc = window.location;
            const wsProtocol = loc.protocol === "https:" ? "wss:" : "ws:";
            const wsUrl = `${wsProtocol}//${loc.host}/ws`;

            ws = new WebSocket(wsUrl);

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === "STATE_UPDATE") {
                    renderState(msg.state);
                } else if (msg.type === "goal") {
                    showGoalOverlay(msg);
                } else if (msg.type === "buzzer") {
                    playBuzzerSound();
                }
            };

            ws.onclose = () => {
                setTimeout(connectWS, 1500);
            };
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function renderState(s) {
            // Clock & Period
            document.getElementById("clockDisplay").innerText = formatTime(s.time_remaining);
            document.getElementById("periodDisplay").innerText = s.period === "OT" ? "OVERTIME" : `DRITTEL ${s.period}`;

            // Home
            document.getElementById("homeName").innerText = s.home_name;
            document.getElementById("homeScore").innerText = s.home_score;
            document.getElementById("homeShots").innerText = s.home_shots;
            document.getElementById("homeScore").style.color = s.home_color || 'var(--accent-home)';
            document.getElementById("homeCard").style.borderTopColor = s.home_color || 'var(--accent-home)';

            const homeLogo = document.getElementById("homeLogo");
            if (s.home_logo) {
                homeLogo.src = s.home_logo;
                homeLogo.classList.add("has-logo");
            } else {
                homeLogo.classList.remove("has-logo");
            }

            // Away
            document.getElementById("awayName").innerText = s.away_name;
            document.getElementById("awayScore").innerText = s.away_score;
            document.getElementById("awayShots").innerText = s.away_shots;
            document.getElementById("awayScore").style.color = s.away_color || 'var(--accent-away)';
            document.getElementById("awayCard").style.borderTopColor = s.away_color || 'var(--accent-away)';

            const awayLogo = document.getElementById("awayLogo");
            if (s.away_logo) {
                awayLogo.src = s.away_logo;
                awayLogo.classList.add("has-logo");
            } else {
                awayLogo.classList.remove("has-logo");
            }

            // Penalties
            renderPenalties(s.home_penalties, s.away_penalties, s.home_name, s.away_name);

            // Goals list
            renderGoals(s.home_goals || [], s.away_goals || [], s.home_name, s.away_name);

            // Break / Intermission View
            const breakView = document.getElementById("breakView");
            if (s.break_mode) {
                breakView.classList.add("active");
                document.getElementById("breakClockDisplay").innerText = formatTime(s.break_time_remaining || 0);
                document.getElementById("breakScoreSummary").innerText = `${s.home_name}  ${s.home_score} : ${s.away_score}  ${s.away_name}`;
                startSponsorSlideshow();
            } else {
                breakView.classList.remove("active");
                stopSponsorSlideshow();
            }
        }

        function renderPenalties(homePens = [], awayPens = [], homeName, awayName) {
            const list = document.getElementById("penaltyList");
            const allPens = [];

            homePens.forEach(p => allPens.push({ team: homeName, ...p }));
            awayPens.forEach(p => allPens.push({ team: awayName, ...p }));

            if (allPens.length === 0) {
                list.innerHTML = '<span style="color: var(--text-dim); font-size: 1vw;">Keine aktiven Strafen</span>';
                return;
            }

            list.innerHTML = allPens.map(p => `
                <div class="penalty-badge">
                    <span>${p.team} #${p.player}</span>
                    <span style="background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px;">${formatTime(p.remaining_seconds)}</span>
                </div>
            `).join('');
        }

        function renderGoals(homeGoals = [], awayGoals = [], homeName, awayName) {
            const list = document.getElementById("goalsList");
            const combined = [];

            homeGoals.forEach(g => combined.push({ team: homeName, ...g }));
            awayGoals.forEach(g => combined.push({ team: awayName, ...g }));

            if (combined.length === 0) {
                list.innerHTML = '<span style="color: var(--text-dim); font-size: 1vw;">Noch keine Tore</span>';
                return;
            }

            list.innerHTML = combined.slice(-5).map(g => `
                <div class="goal-badge">
                    <span>${g.time} (${g.team}): ${g.player}</span>
                </div>
            `).join('');
        }

        // ================= GOAL OVERLAY =================
        function showGoalOverlay(data) {
            const overlay = document.getElementById("goalOverlay");
            const teamEl = document.getElementById("goalHeroTeam");
            const scorerEl = document.getElementById("goalHeroScorer");
            const logoEl = document.getElementById("goalHeroLogo");

            teamEl.innerText = data.team_name || (data.team === "home" ? "HEIM" : "GAST");
            scorerEl.innerText = data.scorer ? `Torschütze: ${data.scorer}` : "TOR!";

            if (data.team_logo) {
                logoEl.src = data.team_logo;
                logoEl.style.display = "block";
            } else {
                logoEl.style.display = "none";
            }

            overlay.classList.add("active");

            if (goalTimeout) clearTimeout(goalTimeout);
            goalTimeout = setTimeout(() => {
                overlay.classList.remove("active");
            }, 5000);
        }

        // ================= SPONSOR SLIDESHOW =================
        async function loadSponsors() {
            try {
                const res = await fetch("/api/sponsors");
                sponsorsList = await res.json();
                buildSponsorElements();
            } catch (e) {
                console.error("Error loading sponsors:", e);
            }
        }

        function buildSponsorElements() {
            const stage = document.getElementById("sponsorStage");
            if (!sponsorsList || sponsorsList.length === 0) {
                stage.innerHTML = '<div style="color: var(--text-dim); font-size: 1.5vw;" id="noSponsorsNotice">Präsentiert von unseren Sponsoren</div>';
                return;
            }

            stage.innerHTML = sponsorsList.map((s, idx) => `
                <img src="${s.url}" class="sponsor-slide ${idx === 0 ? 'visible' : ''}" id="sponsorSlide_${idx}">
            `).join('');
        }

        function startSponsorSlideshow() {
            if (sponsorInterval || sponsorsList.length <= 1) return;
            sponsorInterval = setInterval(() => {
                const total = sponsorsList.length;
                if (total <= 1) return;

                const prev = document.getElementById(`sponsorSlide_${sponsorIndex}`);
                if (prev) prev.classList.remove("visible");

                sponsorIndex = (sponsorIndex + 1) % total;

                const next = document.getElementById(`sponsorSlide_${sponsorIndex}`);
                if (next) next.classList.add("visible");
            }, 4000);
        }

        function stopSponsorSlideshow() {
            if (sponsorInterval) {
                clearInterval(sponsorInterval);
                sponsorInterval = null;
            }
        }

        function playBuzzerSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, ctx.currentTime);
                gain.gain.setValueAtTime(0.8, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 1.2);
            } catch (e) {
                console.log("Audio not supported or allowed yet.");
            }
        }

        // INIT
        connectWS();
        loadSponsors();
    </script>
</body>
</html>

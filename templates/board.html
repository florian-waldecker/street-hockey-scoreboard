<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street Hockey Live Scoreboard</title>
    <style>
        :root {
            --bg-board: #05070c;
            --digit-clock: #ffff00;   /* Neon Yellow */
            --digit-home: #ff3344;    /* Vivid Neon Red */
            --digit-away: #00e5ff;    /* Electric Cyan */
            --digit-period: #00ff66;  /* Neon Green */
            --digit-penalty: #ff9900; /* Neon Orange */
            --text-label: #6b7280;
            --box-bg: #0c101a;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
        }

        body {
            background-color: var(--bg-board);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2.5vh 3vw;
        }

        /* TOP SECTION: PERIOD & MAIN CLOCK */
        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--box-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 1.5vh 4vw;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .period-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .period-label {
            font-size: 2.2vh;
            font-weight: 800;
            color: var(--text-label);
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .period-val {
            font-size: 9vh;
            font-weight: 900;
            color: var(--digit-period);
            line-height: 1;
            text-shadow: 0 0 25px rgba(0, 255, 102, 0.4);
            font-variant-numeric: tabular-nums;
        }

        .clock-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .clock-label {
            font-size: 2vh;
            font-weight: 800;
            color: var(--text-label);
            letter-spacing: 5px;
            text-transform: uppercase;
        }
        .clock-val {
            font-size: 16vh;
            font-weight: 900;
            color: var(--digit-clock);
            line-height: 1;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 35px rgba(255, 255, 0, 0.5);
            letter-spacing: 2px;
        }

        /* MAIN SECTION: HOME vs AWAY */
        .main-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3vw;
            flex: 1;
            margin: 2vh 0;
        }

        .team-card {
            background: var(--box-bg);
            border: 2px solid var(--border-color);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 2.5vh 2vw;
            box-shadow: 0 15px 50px rgba(0,0,0,0.7);
            position: relative;
        }

        .home-card { border-top: 8px solid var(--digit-home); }
        .away-card { border-top: 8px solid var(--digit-away); }

        .team-name {
            font-size: 6vh;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 90%;
            text-align: center;
        }

        .score-val {
            font-size: 26vh;
            font-weight: 900;
            line-height: 0.9;
            font-variant-numeric: tabular-nums;
            margin: auto 0;
        }

        .home-card .score-val {
            color: var(--digit-home);
            text-shadow: 0 0 45px rgba(255, 51, 68, 0.5);
        }

        .away-card .score-val {
            color: var(--digit-away);
            text-shadow: 0 0 45px rgba(0, 229, 255, 0.5);
        }

        /* STATS BAR (SHOTS ON GOAL) */
        .team-stats {
            display: flex;
            align-items: baseline;
            gap: 1vw;
            background: rgba(255,255,255,0.03);
            padding: 0.8vh 2vw;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .stats-label {
            font-size: 2.2vh;
            font-weight: 700;
            color: var(--text-label);
            letter-spacing: 2px;
        }
        .stats-val {
            font-size: 4.5vh;
            font-weight: 900;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
        }

        /* BOTTOM SECTION: PENALTIES */
        .penalty-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3vw;
            min-height: 11vh;
        }

        .penalty-box {
            background: var(--box-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 1vh 2vw;
        }

        .penalty-title {
            font-size: 2vh;
            font-weight: 800;
            color: var(--digit-penalty);
            letter-spacing: 3px;
        }

        .penalty-slots {
            display: flex;
            gap: 2vw;
        }

        .penalty-item {
            display: flex;
            align-items: center;
            gap: 0.8vw;
            background: rgba(255, 153, 0, 0.1);
            border: 1px solid rgba(255, 153, 0, 0.3);
            padding: 0.4vh 1.2vw;
            border-radius: 10px;
        }

        .penalty-player {
            font-size: 3vh;
            font-weight: 900;
            color: #ffffff;
        }

        .penalty-timer {
            font-size: 3.8vh;
            font-weight: 900;
            color: var(--digit-penalty);
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 15px rgba(255, 153, 0, 0.5);
        }

        /* BUZZER FLASH OVERLAY */
        #buzzerOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 0, 0, 0.4);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s ease-out;
            z-index: 999;
        }

        #buzzerOverlay.active {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div id="buzzerOverlay"></div>

    <!-- TOP: PERIOD & TIMER -->
    <div class="top-section">
        <div class="period-box">
            <span class="period-label">DRITTEL</span>
            <span class="period-val" id="periodVal">1</span>
        </div>

        <div class="clock-box">
            <span class="clock-label">SPIELZEIT</span>
            <span class="clock-val" id="clockVal">15:00</span>
        </div>

        <div class="period-box" style="visibility: hidden;">
            <span class="period-label">DRITTEL</span>
            <span class="period-val">1</span>
        </div>
    </div>

    <!-- MAIN: TEAMS, SCORE & SHOTS -->
    <div class="main-section">
        <!-- HOME -->
        <div class="team-card home-card">
            <div class="team-name" id="homeName">HEIM</div>
            <div class="score-val" id="homeScore">0</div>
            <div class="team-stats">
                <span class="stats-label">SCHÜSSE:</span>
                <span class="stats-val" id="homeShots">0</span>
            </div>
        </div>

        <!-- AWAY -->
        <div class="team-card away-card">
            <div class="team-name" id="awayName">GAST</div>
            <div class="score-val" id="awayScore">0</div>
            <div class="team-stats">
                <span class="stats-label">SCHÜSSE:</span>
                <span class="stats-val" id="awayShots">0</span>
            </div>
        </div>
    </div>

    <!-- BOTTOM: PENALTIES -->
    <div class="penalty-section">
        <!-- HOME PENALTIES -->
        <div class="penalty-box">
            <span class="penalty-title">STRAFEN</span>
            <div class="penalty-slots" id="homePenaltyContainer">
                <span style="color: var(--text-label); font-weight: 700; font-size: 2vh;">—</span>
            </div>
        </div>

        <!-- AWAY PENALTIES -->
        <div class="penalty-box">
            <span class="penalty-title">STRAFEN</span>
            <div class="penalty-slots" id="awayPenaltyContainer">
                <span style="color: var(--text-label); font-weight: 700; font-size: 2vh;">—</span>
            </div>
        </div>
    </div>

    <script>
        let ws;
        let lastBuzzerCount = 0;
        let audioCtx = null;

        // Offline Web Audio API Synthesizer for Buzzer / Horn
        function playBuzzerSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = "sawtooth";
                // Hockey Horn fundamental frequency with rich harmonics
                osc.frequency.setValueAtTime(140, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 1.2);

                gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 1.5);
            } catch (e) {
                console.warn("Audio Context error:", e);
            }

            // Visual Flash
            const overlay = document.getElementById("buzzerOverlay");
            overlay.classList.add("active");
            setTimeout(() => overlay.classList.remove("active"), 600);
        }

        // Enable Web Audio on first user interaction
        window.addEventListener("click", () => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }, { once: true });

        function formatTime(totalSeconds) {
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function connectWS() {
            const loc = window.location;
            const wsProtocol = loc.protocol === "https:" ? "wss:" : "ws:";
            const wsUrl = `${wsProtocol}//${loc.host}/ws`;

            ws = new WebSocket(wsUrl);

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === "STATE_UPDATE") {
                    updateBoard(msg.state);
                }
            };

            ws.onclose = () => {
                setTimeout(connectWS, 1500);
            };
        }

        function updateBoard(state) {
            // Teams & Score
            document.getElementById("homeName").innerText = state.home_name;
            document.getElementById("awayName").innerText = state.away_name;
            document.getElementById("homeScore").innerText = state.home_score;
            document.getElementById("awayScore").innerText = state.away_score;
            document.getElementById("homeShots").innerText = state.home_shots;
            document.getElementById("awayShots").innerText = state.away_shots;

            // Period & Clock
            document.getElementById("periodVal").innerText = state.period;
            document.getElementById("clockVal").innerText = formatTime(state.time_remaining);

            // Penalties: Home
            const homeContainer = document.getElementById("homePenaltyContainer");
            if (state.home_penalties.length === 0) {
                homeContainer.innerHTML = '<span style="color: var(--text-label); font-weight: 700; font-size: 2vh;">—</span>';
            } else {
                homeContainer.innerHTML = state.home_penalties.map(p => `
                    <div class="penalty-item">
                        <span class="penalty-player">#${p.player}</span>
                        <span class="penalty-timer">${formatTime(p.remaining_seconds)}</span>
                    </div>
                `).join('');
            }

            // Penalties: Away
            const awayContainer = document.getElementById("awayPenaltyContainer");
            if (state.away_penalties.length === 0) {
                awayContainer.innerHTML = '<span style="color: var(--text-label); font-weight: 700; font-size: 2vh;">—</span>';
            } else {
                awayContainer.innerHTML = state.away_penalties.map(p => `
                    <div class="penalty-item">
                        <span class="penalty-player">#${p.player}</span>
                        <span class="penalty-timer">${formatTime(p.remaining_seconds)}</span>
                    </div>
                `).join('');
            }

            // Buzzer Trigger Check
            if (lastBuzzerCount !== 0 && state.buzzer_trigger > lastBuzzerCount) {
                playBuzzerSound();
            }
            lastBuzzerCount = state.buzzer_trigger;
        }

        connectWS();
    </script>
</body>
</html>

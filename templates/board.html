<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street Hockey Live Scoreboard</title>
    <style>
        :root {
            --bg-board: #05070c;
            --digit-clock: #ffff00;   /* Neon Yellow */
            --digit-period: #00ff66;  /* Neon Green */
            --digit-penalty: #ff9900; /* Neon Orange */
            --text-label: #6b7280;
            --box-bg: #0c101a;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
        }

        body {
            background-color: var(--bg-board);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2vh 2.5vw;
            position: relative;
        }

        /* TOP SECTION: PERIOD & MAIN CLOCK */
        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--box-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 0.8vh 4vw;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .period-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .period-label {
            font-size: 2vh;
            font-weight: 800;
            color: var(--text-label);
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .period-val {
            font-size: 8vh;
            font-weight: 900;
            color: var(--digit-period);
            line-height: 1;
            text-shadow: 0 0 25px rgba(0, 255, 102, 0.4);
            font-variant-numeric: tabular-nums;
        }

        .clock-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .clock-label {
            font-size: 1.8vh;
            font-weight: 800;
            color: var(--text-label);
            letter-spacing: 5px;
            text-transform: uppercase;
        }
        .clock-val {
            font-size: 14.5vh;
            font-weight: 900;
            color: var(--digit-clock);
            line-height: 1;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 35px rgba(255, 255, 0, 0.5);
            letter-spacing: 2px;
        }

        /* MAIN SECTION: HOME vs AWAY */
        .main-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5vw;
            flex: 1;
            margin: 1.5vh 0;
        }

        .team-card {
            background: var(--box-bg);
            border: 2px solid var(--border-color);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 2vh 2.5vw;
            box-shadow: 0 15px 50px rgba(0,0,0,0.7);
            position: relative;
            transition: all 0.3s;
        }

        /* TEAM NAME - MULTI-LINE SUPPORT WITH CUSTOM TEXT COLOR */
        .team-name {
            font-size: 4.8vh;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            line-height: 1.15;
            max-height: 11vh;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
            width: 100%;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        /* CENTER CONTENT: BIG LOGO + SCORE */
        .score-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3vw;
            width: 100%;
            margin: auto 0;
        }

        .team-logo-big {
            height: 22vh;
            width: 22vh;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.25));
            display: none;
        }
        .team-logo-big.has-logo { display: block; }

        .score-val {
            font-size: 24vh;
            font-weight: 900;
            line-height: 0.9;
            font-variant-numeric: tabular-nums;
            letter-spacing: -2px;
        }

        /* STATS BAR (SHOTS ON GOAL) */
        .team-stats {
            display: flex;
            align-items: baseline;
            gap: 1vw;
            background: rgba(255,255,255,0.03);
            padding: 0.6vh 2vw;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .stats-label {
            font-size: 2vh;
            font-weight: 700;
            color: var(--text-label);
            letter-spacing: 2px;
        }
        .stats-val {
            font-size: 3.8vh;
            font-weight: 900;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
        }

        /* BOTTOM SECTION: PENALTIES */
        .penalty-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5vw;
            min-height: 9vh;
        }

        .penalty-box {
            background: var(--box-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0.6vh 1.5vw;
            overflow-x: auto;
        }

        .penalty-title {
            font-size: 1.8vh;
            font-weight: 800;
            color: var(--digit-penalty);
            letter-spacing: 3px;
        }

        .penalty-slots {
            display: flex;
            gap: 1.5vw;
            align-items: center;
        }

        .penalty-item {
            display: flex;
            align-items: center;
            gap: 0.6vw;
            background: rgba(255, 153, 0, 0.1);
            border: 1px solid rgba(255, 153, 0, 0.3);
            padding: 0.4vh 1vw;
            border-radius: 10px;
        }

        .penalty-item.bench {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
            opacity: 0.7;
        }

        .penalty-player {
            font-size: 2.6vh;
            font-weight: 900;
            color: #ffffff;
        }

        .penalty-timer {
            font-size: 3.2vh;
            font-weight: 900;
            color: var(--digit-penalty);
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 15px rgba(255, 153, 0, 0.5);
        }

        .penalty-item.bench .penalty-timer {
            color: #94a3b8;
            text-shadow: none;
        }

        /* ==========================================
           FULLSCREEN 5-SECOND GOAL OVERLAY
           ========================================== */
        #goalOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2vh;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
            background: #05070c;
        }

        #goalOverlay.active {
            opacity: 1;
            pointer-events: auto;
            animation: goalPulse 1.2s infinite alternate ease-in-out;
        }

        @keyframes goalPulse {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.02); filter: brightness(1.25); }
        }

        .goal-text-huge {
            font-size: 24vh;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5vw;
            line-height: 1;
            text-shadow: 0 0 60px rgba(255,255,255,0.8), 0 0 120px rgba(0,0,0,0.9);
            animation: goalTextBounce 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite alternate;
        }

        @keyframes goalTextBounce {
            0% { transform: scale(0.96) translateY(0); }
            100% { transform: scale(1.06) translateY(-10px); }
        }

        .goal-logo-huge {
            max-height: 36vh;
            max-width: 45vw;
            object-fit: contain;
            filter: drop-shadow(0 0 40px rgba(255,255,255,0.6));
            animation: goalLogoSpin 5s ease-out;
        }

        @keyframes goalLogoSpin {
            0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            20% { transform: scale(1.1) rotate(3deg); opacity: 1; }
            40% { transform: scale(1) rotate(0deg); }
        }

        .goal-team-name {
            font-size: 7vh;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.9);
        }

        /* BUZZER FLASH OVERLAY */
        #buzzerOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 0, 0, 0.4);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s ease-out;
            z-index: 999;
        }

        #buzzerOverlay.active {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div id="buzzerOverlay"></div>

    <!-- FULLSCREEN GOAL OVERLAY -->
    <div id="goalOverlay">
        <div class="goal-text-huge" id="goalTitle">TOR!</div>
        <img id="goalTeamLogo" class="goal-logo-huge" src="" alt="Goal Team Logo" style="display: none;">
        <div class="goal-team-name" id="goalTeamName">HEIM</div>
    </div>

    <!-- TOP: PERIOD & TIMER -->
    <div class="top-section">
        <div class="period-box">
            <span class="period-label">DRITTEL</span>
            <span class="period-val" id="periodVal">1</span>
        </div>

        <div class="clock-box">
            <span class="clock-label">SPIELZEIT</span>
            <span class="clock-val" id="clockVal">15:00</span>
        </div>

        <div class="period-box" style="visibility: hidden;">
            <span class="period-label">DRITTEL</span>
            <span class="period-val">1</span>
        </div>
    </div>

    <!-- MAIN: TEAMS, SCORE & SHOTS -->
    <div class="main-section">
        <!-- HOME -->
        <div class="team-card" id="homeCard">
            <div class="team-name" id="homeName">BREMERHAVEN WHALES</div>
            
            <div class="score-row">
                <img id="homeLogo" class="team-logo-big" src="" alt="Logo Heim">
                <div class="score-val" id="homeScore">0</div>
            </div>

            <div class="team-stats">
                <span class="stats-label">SCHÜSSE:</span>
                <span class="stats-val" id="homeShots">0</span>
            </div>
        </div>

        <!-- AWAY -->
        <div class="team-card" id="awayCard">
            <div class="team-name" id="awayName">WOLFSBURG WOLFRIDERS</div>
            
            <div class="score-row">
                <img id="awayLogo" class="team-logo-big" src="" alt="Logo Gast">
                <div class="score-val" id="awayScore">0</div>
            </div>

            <div class="team-stats">
                <span class="stats-label">SCHÜSSE:</span>
                <span class="stats-val" id="awayShots">0</span>
            </div>
        </div>
    </div>

    <!-- BOTTOM: PENALTIES -->
    <div class="penalty-section">
        <!-- HOME PENALTIES -->
        <div class="penalty-box">
            <span class="penalty-title">STRAFEN</span>
            <div class="penalty-slots" id="homePenaltyContainer">
                <span style="color: var(--text-label); font-weight: 700; font-size: 2vh;">—</span>
            </div>
        </div>

        <!-- AWAY PENALTIES -->
        <div class="penalty-box">
            <span class="penalty-title">STRAFEN</span>
            <div class="penalty-slots" id="awayPenaltyContainer">
                <span style="color: var(--text-label); font-weight: 700; font-size: 2vh;">—</span>
            </div>
        </div>
    </div>

    <script>
        let ws;
        let lastBuzzerCount = 0;
        let audioCtx = null;
        let goalTimeout = null;

        function playBuzzerSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = "sawtooth";
                osc.frequency.setValueAtTime(140, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 1.2);

                gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 1.5);
            } catch (e) {
                console.warn("Audio error:", e);
            }

            const overlay = document.getElementById("buzzerOverlay");
            overlay.classList.add("active");
            setTimeout(() => overlay.classList.remove("active"), 600);
        }

        // Play Goal Horn Sound
        function playGoalHorn() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const now = audioCtx.currentTime;
                
                // Double pulse Goal Horn
                [0, 1.4].forEach(offset => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(155, now + offset);
                    osc.frequency.linearRampToValueAtTime(130, now + offset + 1.0);
                    gain.gain.setValueAtTime(0.85, now + offset);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + offset + 1.1);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + offset);
                    osc.stop(now + offset + 1.1);
                });
            } catch (e) {
                console.warn("Goal Horn error:", e);
            }
        }

        window.addEventListener("click", () => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }, { once: true });

        function formatTime(totalSeconds) {
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function hexToRgba(hex, alpha) {
            let c;
            if (/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)) {
                c = hex.substring(1).split('');
                if (c.length === 3) {
                    c = [c[0], c[0], c[1], c[1], c[2], c[2]];
                }
                c = '0x' + c.join('');
                return `rgba(${[(c>>16)&255, (c>>8)&255, c&255].join(',')}, ${alpha})`;
            }
            return hex;
        }

        // ==========================================
        // 5-SECOND GOAL ANIMATION TRIGGER
        // ==========================================
        function triggerGoalAnimation(data) {
            const overlay = document.getElementById("goalOverlay");
            const title = document.getElementById("goalTitle");
            const logo = document.getElementById("goalTeamLogo");
            const name = document.getElementById("goalTeamName");

            const teamColor = data.color || "#ef4444";
            const textColor = data.text_color || "#ffffff";

            // Dynamic team-color background radial glow
            overlay.style.background = `radial-gradient(circle at center, ${hexToRgba(teamColor, 0.85)} 0%, #05070c 85%)`;
            title.style.color = textColor;
            name.style.color = textColor;
            name.innerText = data.team_name || "TEAM";

            if (data.logo_url) {
                logo.src = data.logo_url;
                logo.style.display = "block";
            } else {
                logo.style.display = "none";
            }

            // Play horn
            playGoalHorn();

            // Clear existing timeout if multiple goals scored quickly
            if (goalTimeout) clearTimeout(goalTimeout);

            // Activate Overlay
            overlay.classList.add("active");

            // Auto Fade-out exactly after 5 seconds (5000ms)
            goalTimeout = setTimeout(() => {
                overlay.classList.remove("active");
            }, 5000);
        }

        function connectWS() {
            const loc = window.location;
            const wsProtocol = loc.protocol === "https:" ? "wss:" : "ws:";
            const wsUrl = `${wsProtocol}//${loc.host}/ws`;

            ws = new WebSocket(wsUrl);

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === "STATE_UPDATE") {
                    updateBoard(msg.state);
                } else if (msg.type === "goal") {
                    triggerGoalAnimation(msg);
                }
            };

            ws.onclose = () => {
                setTimeout(connectWS, 1500);
            };
        }

        function updateBoard(state) {
            // Teams & Score
            const homeNameEl = document.getElementById("homeName");
            const awayNameEl = document.getElementById("awayName");

            homeNameEl.innerText = state.home_name;
            awayNameEl.innerText = state.away_name;

            // Separate Text Color Support
            if (state.home_text_color) homeNameEl.style.color = state.home_text_color;
            if (state.away_text_color) awayNameEl.style.color = state.away_text_color;

            document.getElementById("homeScore").innerText = state.home_score;
            document.getElementById("awayScore").innerText = state.away_score;
            document.getElementById("homeShots").innerText = state.home_shots;
            document.getElementById("awayShots").innerText = state.away_shots;

            // Custom Team Colors (Border, Score Glow & Background Tint)
            const homeCard = document.getElementById("homeCard");
            const homeScore = document.getElementById("homeScore");
            if (state.home_color) {
                homeCard.style.borderTop = `8px solid ${state.home_color}`;
                homeCard.style.background = `linear-gradient(180deg, ${hexToRgba(state.home_color, 0.15)} 0%, #0c101a 100%)`;
                homeScore.style.color = state.home_color;
                homeScore.style.textShadow = `0 0 45px ${hexToRgba(state.home_color, 0.5)}`;
            }

            const awayCard = document.getElementById("awayCard");
            const awayScore = document.getElementById("awayScore");
            if (state.away_color) {
                awayCard.style.borderTop = `8px solid ${state.away_color}`;
                awayCard.style.background = `linear-gradient(180deg, ${hexToRgba(state.away_color, 0.15)} 0%, #0c101a 100%)`;
                awayScore.style.color = state.away_color;
                awayScore.style.textShadow = `0 0 45px ${hexToRgba(state.away_color, 0.5)}`;
            }

            // Logos (Big next to Score)
            const homeLogo = document.getElementById("homeLogo");
            if (state.home_logo) {
                homeLogo.src = state.home_logo;
                homeLogo.className = "team-logo-big has-logo";
            } else {
                homeLogo.className = "team-logo-big";
            }

            const awayLogo = document.getElementById("awayLogo");
            if (state.away_logo) {
                awayLogo.src = state.away_logo;
                awayLogo.className = "team-logo-big has-logo";
            } else {
                awayLogo.className = "team-logo-big";
            }

            // Period & Clock
            document.getElementById("periodVal").innerText = state.period;
            document.getElementById("clockVal").innerText = formatTime(state.time_remaining);

            // Penalties: Home
            const homeContainer = document.getElementById("homePenaltyContainer");
            if (state.home_penalties.length === 0) {
                homeContainer.innerHTML = '<span style="color: var(--text-label); font-weight: 700; font-size: 2vh;">—</span>';
            } else {
                homeContainer.innerHTML = state.home_penalties.map((p, idx) => {
                    const isBench = idx >= 2;
                    return `
                        <div class="penalty-item ${isBench ? 'bench' : ''}">
                            <span class="penalty-player">#${p.player}</span>
                            <span class="penalty-timer">${formatTime(p.remaining_seconds)}</span>
                        </div>
                    `;
                }).join('');
            }

            // Penalties: Away
            const awayContainer = document.getElementById("awayPenaltyContainer");
            if (state.away_penalties.length === 0) {
                awayContainer.innerHTML = '<span style="color: var(--text-label); font-weight: 700; font-size: 2vh;">—</span>';
            } else {
                awayContainer.innerHTML = state.away_penalties.map((p, idx) => {
                    const isBench = idx >= 2;
                    return `
                        <div class="penalty-item ${isBench ? 'bench' : ''}">
                            <span class="penalty-player">#${p.player}</span>
                            <span class="penalty-timer">${formatTime(p.remaining_seconds)}</span>
                        </div>
                    `;
                }).join('');
            }

            // Buzzer Trigger Check
            if (lastBuzzerCount !== 0 && state.buzzer_trigger > lastBuzzerCount) {
                playBuzzerSound();
            }
            lastBuzzerCount = state.buzzer_trigger;
        }

        connectWS();
    </script>
</body>
</html>
